name: Run member matching (ゆるマッチング)

on:
  schedule:
    # 朝5:30 JSTだと寝ている人に通知が届いてしまうため、日中の3回に分散。
    # 各回、その時点でマッチング対象(interval_days経過済み)がいなければ何も投稿しない(no-op)。
    # 分は0(ちょうど毎時)を避けている: GitHubは毎時00分に世界中のスケジュール実行が
    # 集中し遅延しやすいと案内している(このリポジトリでも他のcronで実測1〜2時間の遅延あり)。
    - cron: "7 0 * * *"   # 00:07 UTC = 09:07 JST
    - cron: "7 3 * * *"   # 03:07 UTC = 12:07 JST
    - cron: "7 10 * * *"  # 10:07 UTC = 19:07 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-matching:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run matching batch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_MATCHING_CHANNEL_ID: ${{ secrets.DISCORD_MATCHING_CHANNEL_ID }}
        run: python3 scripts/run_member_matching.py --post-to-discord
