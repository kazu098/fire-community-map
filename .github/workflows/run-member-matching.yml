name: Run member matching (ゆるマッチング)

on:
  schedule:
    # 朝5:30 JSTだと寝ている人に通知が届いてしまうため、日中の3回に分散。
    # 各回、その時点でマッチング対象(interval_days経過済み)がいなければ何も投稿しない(no-op)。
    - cron: "0 0 * * *"   # 00:00 UTC = 09:00 JST
    - cron: "0 3 * * *"   # 03:00 UTC = 12:00 JST
    - cron: "0 10 * * *"  # 10:00 UTC = 19:00 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-matching:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run matching batch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_MATCHING_CHANNEL_ID: ${{ secrets.DISCORD_MATCHING_CHANNEL_ID }}
        run: python3 scripts/run_member_matching.py --post-to-discord
