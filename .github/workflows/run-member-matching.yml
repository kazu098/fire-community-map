name: Run member matching (ゆるマッチング)

on:
  schedule:
    # 20:30 UTC = 05:30 JST
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-matching:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run matching batch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_MATCHING_CHANNEL_ID: ${{ secrets.DISCORD_MATCHING_CHANNEL_ID }}
        run: python3 scripts/run_member_matching.py --post-to-discord
