name: Sync community events

on:
  schedule:
    # 20:30 UTC = 05:30 JST
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Discord event candidates
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          python3 scripts/fetch_community_events.py \
            --since 2026-01-01T00:00:00+09:00 \
            --output tmp/community_events_raw.json \
            --state-file tmp/community_events_sync_state.json \
            --skip-scheduled-events

      - name: Sync Discord scheduled events
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/sync_scheduled_events.py

      - name: Auto-review safe event supplements
        run: |
          python3 scripts/auto_review_event_candidates.py \
            --raw tmp/community_events_raw.json \
            --curated data/community_events_curated.json \
            --applied-message-ids-output tmp/community_events_auto_applied_message_ids.json \
            --pr-body-output tmp/community_events_auto_review_pr_body.md \
            --summary-output tmp/community_events_auto_review_summary.json \
            --lookback-hours 26 \
            --min-score 3

      - name: Create auto-review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/community_events_curated.json; then
            echo "No auto-reviewed event changes."
            exit 0
          fi
          python3 -m json.tool data/community_events_curated.json > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="auto/community-events-review-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add data/community_events_curated.json
          git commit -m "Auto-review community event candidates"
          git push origin "$branch"
          gh pr create \
            --title "Auto-review community event candidates" \
            --body-file tmp/community_events_auto_review_pr_body.md \
            --base main \
            --head "$branch"

      - name: Build review-needed report
        run: |
          python3 scripts/build_event_review_report.py \
            --raw tmp/community_events_raw.json \
            --curated data/community_events_curated.json \
            --output tmp/community_events_review_needed.md \
            --count-output tmp/community_events_review_count.txt \
            --lookback-hours 26 \
            --min-score 3 \
            --exclude-message-ids tmp/community_events_auto_applied_message_ids.json

      - name: Create review issue
        if: ${{ hashFiles('tmp/community_events_review_count.txt') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(cat tmp/community_events_review_count.txt)"
          if [ "$count" = "0" ]; then
            echo "No review-needed event candidates."
            exit 0
          fi
          title="イベント候補の確認が必要です - $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file tmp/community_events_review_needed.md
          else
            gh issue create \
              --title "$title" \
              --body-file tmp/community_events_review_needed.md
          fi
