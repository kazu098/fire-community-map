name: Sync community content candidates

on:
  schedule:
    # 20:30 UTC = 05:30 JST
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  review-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Discord community post deltas
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          python3 scripts/fetch_community_posts.py \
            --since 2026-01-01T00:00:00+09:00 \
            --output tmp/community_posts_raw.json \
            --state-file data/community_posts_sync_state.json

      - name: Build auto-curated book posts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/build_auto_book_posts.py \
            --raw tmp/community_posts_raw.json \
            --curated tmp/community_posts_curated.json \
            --output tmp/community_posts_book_auto.json \
            --review-output tmp/community_posts_book_review_needed.md \
            --count-output tmp/community_posts_book_auto_count.txt \
            --review-count-output tmp/community_posts_book_review_count.txt

      - name: Upsert auto-curated book posts
        if: ${{ hashFiles('tmp/community_posts_book_auto_count.txt') != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          count="$(cat tmp/community_posts_book_auto_count.txt)"
          if [ "$count" = "0" ]; then
            echo "No auto-curated book posts."
            exit 0
          fi
          python3 scripts/load_community_posts.py \
            --curated tmp/community_posts_book_auto.json

      - name: Sync auto-qualified travel and gourmet posts
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: python3 scripts/sync_travel_posts.py

      - name: Upsert auto-synced travel posts
        env:
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if git diff --quiet -- data/travel_posts.json; then
            echo "No auto-synced travel posts to upsert."
            exit 0
          fi
          python3 scripts/load_travel_posts_to_community_posts.py

      - name: Build review-needed report
        run: |
          python3 scripts/build_community_content_review_report.py \
            --raw tmp/community_posts_raw.json \
            --curated tmp/community_posts_book_auto.json \
            --travel-posts data/travel_posts.json \
            --output tmp/community_content_review_needed.md \
            --count-output tmp/community_content_review_count.txt \
            --limit 30

      - name: Create review issue
        if: ${{ hashFiles('tmp/community_content_review_count.txt') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(cat tmp/community_content_review_count.txt)"
          if [ "$count" = "0" ]; then
            echo "No review-needed community content candidates."
            exit 0
          fi
          title="暮らしの知恵・旅行グルメ候補の確認が必要です - $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file tmp/community_content_review_needed.md
          else
            gh issue create \
              --title "$title" \
              --body-file tmp/community_content_review_needed.md
          fi

      - name: Commit sync state
        run: |
          changed="$(git status --porcelain -- data/community_posts_sync_state.json data/travel_sync_state.json data/travel_posts.json data/travel-photos data/travel-avatars)"
          if [ -z "$changed" ]; then
            echo "No community content data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/community_posts_sync_state.json data/travel_sync_state.json data/travel_posts.json data/travel-photos data/travel-avatars
          git commit -m "Advance community content sync state"
          git pull --rebase origin main
          git push origin HEAD:main
