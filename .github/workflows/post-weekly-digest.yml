name: Post weekly digest (週次ダイジェスト)

on:
  schedule:
    # 21:00 UTC Sunday = 06:00 JST Monday
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute lookback start (JST)
        id: since
        run: |
          echo "since=$(TZ=Asia/Tokyo date -d '8 days ago' +%Y-%m-%dT00:00:00+09:00)" >> "$GITHUB_OUTPUT"

      - name: Fetch Discord event candidates
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          python3 scripts/fetch_community_events.py \
            --reset-state \
            --since "${{ steps.since.outputs.since }}" \
            --output tmp/community_events_raw.json \
            --state-file tmp/community_events_sync_state.json

      - name: Fetch Discord topic candidates
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          python3 scripts/fetch_community_posts.py \
            --reset-state \
            --since "${{ steps.since.outputs.since }}" \
            --output tmp/community_posts_raw.json \
            --state-file tmp/community_posts_sync_state.json \
            --include-digest-channels

      - name: Generate and post weekly digest
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_DIGEST_CHANNEL_ID: ${{ secrets.DISCORD_DIGEST_CHANNEL_ID }}
        run: |
          python3 scripts/generate_weekly_digest.py \
            --days 7 \
            --events-raw tmp/community_events_raw.json \
            --posts-raw tmp/community_posts_raw.json \
            --post-to-discord
