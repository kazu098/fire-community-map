name: Sync member Discord IDs

on:
  schedule:
    # 20:15 UTC = 05:15 JST, just before the matching batch (05:30 JST)
    - cron: "15 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-discord-ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Discord user ids
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: python3 scripts/sync_member_discord_ids.py
