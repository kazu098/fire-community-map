// ================================================================
// イベント開催記録
// community_events テーブルから読み込み、開催日時で「これから開催」と
// 「開催済み」に分ける。種別はナビゲーションではなく小さなタグとして出す。
// ================================================================

let communityEvents = [];
let communityEventsUnavailable = false;
let activeEventsSection = 'calendar';
const EVENT_PAGE_SIZE = 10;
const eventPages = { calendar: 1, upcoming: 1, past: 1 };
const eventCalendarMonths = { calendar: null, upcoming: null, past: null };
let pendingEventScrollId = null;

const EVENT_FORMAT_LABELS = {
  online: 'オンライン',
  offline: 'オフ会',
  hybrid: 'ハイブリッド',
  unknown: '形式未定',
};

function formatEventDateParts(value) {
  if (!value) return { day: '', weekday: '', time: '' };
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return { day: '', weekday: '', time: '' };
  const day = new Intl.DateTimeFormat('ja-JP', {
    month: 'numeric',
    day: 'numeric',
  }).format(date);
  const weekday = new Intl.DateTimeFormat('ja-JP', {
    weekday: 'short',
  }).format(date);
  const time = new Intl.DateTimeFormat('ja-JP', {
    hour: '2-digit',
    minute: '2-digit',
  }).format(date);
  return { day, weekday, time };
}

function eventTags(event) {
  const tags = Array.isArray(event.tags) ? event.tags.filter(Boolean) : [];
  const formatLabel = EVENT_FORMAT_LABELS[event.format];
  if (formatLabel && !tags.includes(formatLabel)) return [formatLabel, ...tags];
  return tags;
}

function hasEventTag(event, tag) {
  return Array.isArray(event.tags) && event.tags.includes(tag);
}

function isTentativeDateEvent(event) {
  return hasEventTag(event, '日程調整中');
}

function isTentativeTimeEvent(event) {
  return hasEventTag(event, '時間調整中');
}

function isUpcomingEvent(event, now) {
  if (event.cancelled_at) return false;
  const end = event.ends_at ? new Date(event.ends_at) : null;
  const start = new Date(event.starts_at);
  const boundary = end && !Number.isNaN(end.getTime()) ? end : start;
  return !Number.isNaN(boundary.getTime()) && boundary >= now;
}

function isScheduledEventRow(event) {
  return String(event.discord_message_id || '').startsWith('scheduled_event:');
}

function normalizeEventTitle(value) {
  return String(value || '')
    .replace(/[!！\s　]/g, '')
    .replace(/第[0-9０-９]+弾/g, '')
    .trim();
}

function isLikelyDuplicateEvent(a, b) {
  if (!isScheduledEventRow(a) && !isScheduledEventRow(b)) return false;
  if (a.format !== b.format) return false;
  const aStart = new Date(a.starts_at);
  const bStart = new Date(b.starts_at);
  if (Number.isNaN(aStart.getTime()) || Number.isNaN(bStart.getTime())) return false;
  if (Math.abs(aStart.getTime() - bStart.getTime()) > 60 * 1000) return false;
  const aTitle = normalizeEventTitle(a.title);
  const bTitle = normalizeEventTitle(b.title);
  return Boolean(aTitle && bTitle && (aTitle.includes(bTitle) || bTitle.includes(aTitle)));
}

function mergeDuplicateEvent(preferred, duplicate) {
  const preferredTitle = String(preferred.title || '');
  const duplicateTitle = String(duplicate.title || '');
  const title = isScheduledEventRow(duplicate)
    && normalizeEventTitle(duplicateTitle).includes(normalizeEventTitle(preferredTitle))
    && duplicateTitle.length > preferredTitle.length
      ? duplicateTitle.replace(/[!！]+$/g, '')
      : preferred.title;
  return {
    ...preferred,
    title,
    participant_count: preferred.participant_count ?? duplicate.participant_count,
    participation_note: preferred.participation_note || duplicate.participation_note,
    summary: preferred.summary || duplicate.summary,
    discord_channel_name: preferred.discord_channel_name || duplicate.discord_channel_name,
  };
}

function dedupeEvents(events) {
  return events.reduce((deduped, event) => {
    const duplicateIndex = deduped.findIndex(existing => isLikelyDuplicateEvent(existing, event));
    if (duplicateIndex < 0) return [...deduped, event];
    const existing = deduped[duplicateIndex];
    const preferred = isScheduledEventRow(existing) && !isScheduledEventRow(event) ? event : existing;
    const duplicate = preferred === existing ? event : existing;
    const next = deduped.slice();
    next[duplicateIndex] = mergeDuplicateEvent(preferred, duplicate);
    return next;
  }, []);
}

function formatGoogleCalendarDate(value) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return null;
  return date.toISOString().replace(/[-:]|\.\d{3}/g, '');
}

function googleCalendarUrl(event) {
  if (isTentativeDateEvent(event) || isTentativeTimeEvent(event)) return null;
  const start = formatGoogleCalendarDate(event.starts_at);
  if (!start) return null;
  const startDate = new Date(event.starts_at);
  const endDate = event.ends_at ? new Date(event.ends_at) : new Date(startDate.getTime() + 60 * 60 * 1000);
  const end = Number.isNaN(endDate.getTime()) ? null : formatGoogleCalendarDate(endDate.toISOString());
  if (!end) return null;
  const details = [event.summary, event.participation_note, event.discord_permalink]
    .filter(Boolean)
    .join('\n\n');
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: event.title,
    dates: `${start}/${end}`,
  });
  if (details) params.set('details', details);
  const locationText = [event.prefecture, event.location_label].filter(Boolean).join(' / ');
  if (locationText) params.set('location', locationText);
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

function eventDateDisplayParts(event) {
  if (!isTentativeDateEvent(event)) {
    const parts = formatEventDateParts(event.starts_at);
    if (isTentativeTimeEvent(event)) return { ...parts, time: '時間調整中' };
    return parts;
  }
  const date = new Date(event.starts_at);
  const month = Number.isNaN(date.getTime()) ? '候補' : `${date.getMonth() + 1}月`;
  return { day: month, weekday: '候補', time: '日程調整中' };
}

function appendEventText(card, label, text) {
  if (!text) return;
  const row = document.createElement('div');
  row.className = 'event-text';
  const labelEl = document.createElement('span');
  labelEl.className = 'event-note-label';
  labelEl.textContent = `${label}: `;
  row.appendChild(labelEl);
  row.appendChild(document.createTextNode(text));
  card.appendChild(row);
}

function eventDomId(event) {
  return `event-${String(event.discord_message_id || event.title || '').replace(/[^a-zA-Z0-9_-]/g, '-')}`;
}

function buildEventCard(event, mode) {
  const card = document.createElement('div');
  card.className = 'event-card' + (event.cancelled_at ? ' cancelled' : '');
  card.id = eventDomId(event);

  const main = document.createElement('div');
  main.className = 'event-card-main';

  const dateSide = document.createElement('div');
  dateSide.className = 'event-date-side';
  const dateParts = eventDateDisplayParts(event);
  const dateBlock = document.createElement('div');
  dateBlock.className = 'event-date-block' + ((isTentativeDateEvent(event) || isTentativeTimeEvent(event)) ? ' tentative' : '');
  const day = document.createElement('div');
  day.className = 'event-date-day';
  day.textContent = dateParts.day;
  const weekday = document.createElement('div');
  weekday.className = 'event-date-weekday';
  weekday.textContent = `(${dateParts.weekday})`;
  const time = document.createElement('div');
  time.className = 'event-date-time';
  time.textContent = dateParts.time;
  dateBlock.appendChild(day);
  dateBlock.appendChild(weekday);
  dateBlock.appendChild(time);
  dateSide.appendChild(dateBlock);
  const calendarUrl = googleCalendarUrl(event);
  if (calendarUrl) {
    const calendarLink = document.createElement('a');
    calendarLink.className = 'event-calendar-link';
    calendarLink.href = calendarUrl;
    calendarLink.target = '_blank';
    calendarLink.rel = 'noopener';
    calendarLink.textContent = 'Googleカレンダーに追加';
    dateSide.appendChild(calendarLink);
  }
  main.appendChild(dateSide);

  const content = document.createElement('div');
  content.className = 'event-content';

  const title = document.createElement('div');
  title.className = 'event-title';
  title.textContent = event.title;
  content.appendChild(title);

  const tags = document.createElement('div');
  tags.className = 'event-tags';
  if (event.cancelled_at) {
    const cancelled = document.createElement('span');
    cancelled.className = 'event-tag status';
    cancelled.textContent = '中止';
    tags.appendChild(cancelled);
  }
  eventTags(event).forEach(value => {
    const tag = document.createElement('span');
    tag.className = 'event-tag';
    tag.textContent = value;
    tags.appendChild(tag);
  });
  if (tags.children.length) content.appendChild(tags);

  const meta = document.createElement('div');
  meta.className = 'event-meta';
  const metaValues = [];
  const locationText = [event.prefecture, event.location_label].filter(Boolean).join(' / ');
  if (locationText) metaValues.push(locationText);
  if (event.participant_count != null) metaValues.push(`参加 ${event.participant_count}名`);
  metaValues.forEach(value => {
    const item = document.createElement('span');
    item.textContent = value;
    meta.appendChild(item);
  });
  if (meta.children.length) content.appendChild(meta);

  if (mode === 'upcoming') {
    appendEventText(content, '参加方法', event.participation_note);
    appendEventText(content, '概要', event.summary);
  } else {
    appendEventText(content, '概要', event.summary);
    appendEventText(content, 'よかった点', event.highlights);
    appendEventText(content, '次回メモ', event.learnings);
  }

  const actions = document.createElement('div');
  actions.className = 'event-actions';
  if (event.discord_permalink) {
    const link = document.createElement('a');
    link.className = 'event-primary-link';
    link.href = event.discord_permalink;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = 'Discordで見る →';
    actions.appendChild(link);
  }
  if (actions.children.length) content.appendChild(actions);

  main.appendChild(content);
  card.appendChild(main);
  return card;
}

function monthStart(date) {
  return new Date(date.getFullYear(), date.getMonth(), 1);
}

function addMonths(date, delta) {
  return new Date(date.getFullYear(), date.getMonth() + delta, 1);
}

function monthKey(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
}

function eventDateKey(event) {
  const date = new Date(event.starts_at);
  if (Number.isNaN(date.getTime())) return '';
  return [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, '0'),
    String(date.getDate()).padStart(2, '0'),
  ].join('-');
}

function eventTimeLabel(event) {
  if (isTentativeDateEvent(event) || isTentativeTimeEvent(event)) return '';
  const date = new Date(event.starts_at);
  if (Number.isNaN(date.getTime())) return '';
  return new Intl.DateTimeFormat('ja-JP', {
    hour: '2-digit',
    minute: '2-digit',
  }).format(date);
}

function defaultCalendarMonth(events, mode) {
  if (events.length) {
    const event = mode === 'past' ? events[0] : events.find(item => !isTentativeDateEvent(item)) || events[0];
    const date = new Date(event.starts_at);
    if (!Number.isNaN(date.getTime())) return monthStart(date);
  }
  return monthStart(new Date());
}

function renderEventCalendar(events, mode) {
  if (!events.length) return null;
  if (!eventCalendarMonths[mode]) eventCalendarMonths[mode] = defaultCalendarMonth(events, mode);

  const activeMonth = eventCalendarMonths[mode];
  const monthEvents = events.filter(event => {
    const date = new Date(event.starts_at);
    return !Number.isNaN(date.getTime()) && monthKey(date) === monthKey(activeMonth);
  });
  const eventsByDate = monthEvents.reduce((acc, event) => {
    const key = eventDateKey(event);
    if (!key) return acc;
    if (!acc[key]) acc[key] = [];
    acc[key].push(event);
    return acc;
  }, {});
  Object.values(eventsByDate).forEach(dayEvents => {
    dayEvents.sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
  });

  const shell = document.createElement('div');
  shell.className = 'events-calendar';

  const toolbar = document.createElement('div');
  toolbar.className = 'events-calendar-toolbar';

  const title = document.createElement('div');
  title.className = 'events-calendar-title';
  title.textContent = new Intl.DateTimeFormat('ja-JP', { year: 'numeric', month: 'long' }).format(activeMonth);
  toolbar.appendChild(title);

  const actions = document.createElement('div');
  actions.className = 'events-calendar-actions';
  [
    { label: '‹', delta: -1 },
    { label: '今日', delta: 0 },
    { label: '›', delta: 1 },
  ].forEach(item => {
    const button = document.createElement('button');
    button.className = 'events-calendar-button';
    button.type = 'button';
    button.textContent = item.label;
    button.addEventListener('click', () => {
      eventCalendarMonths[mode] = item.delta === 0 ? monthStart(new Date()) : addMonths(activeMonth, item.delta);
      renderEventsView();
    });
    actions.appendChild(button);
  });
  toolbar.appendChild(actions);
  shell.appendChild(toolbar);

  const grid = document.createElement('div');
  grid.className = 'events-calendar-grid';
  ['日', '月', '火', '水', '木', '金', '土'].forEach(label => {
    const weekday = document.createElement('div');
    weekday.className = 'events-calendar-weekday';
    weekday.textContent = label;
    grid.appendChild(weekday);
  });

  const firstCell = new Date(activeMonth);
  firstCell.setDate(firstCell.getDate() - firstCell.getDay());
  const todayKey = eventDateKey({ starts_at: new Date().toISOString() });
  for (let i = 0; i < 42; i += 1) {
    const date = new Date(firstCell);
    date.setDate(firstCell.getDate() + i);
    const key = [
      date.getFullYear(),
      String(date.getMonth() + 1).padStart(2, '0'),
      String(date.getDate()).padStart(2, '0'),
    ].join('-');
    const day = document.createElement('div');
    day.className = 'events-calendar-day' + (date.getMonth() === activeMonth.getMonth() ? '' : ' outside');
    const dateLabel = document.createElement('div');
    dateLabel.className = 'events-calendar-date' + (key === todayKey ? ' today' : '');
    dateLabel.textContent = date.getDate();
    day.appendChild(dateLabel);

    const dayEvents = eventsByDate[key] || [];
    dayEvents.slice(0, 3).forEach(event => {
      const eventButton = document.createElement('button');
      eventButton.className = 'events-calendar-event' + (event.format === 'offline' ? ' offline' : '');
      eventButton.type = 'button';
      const timeLabel = eventTimeLabel(event);
      eventButton.textContent = timeLabel ? `${timeLabel} ${event.title}` : event.title;
      eventButton.title = event.title;
      eventButton.addEventListener('click', () => {
        const pageEvents = mode === 'calendar' ? monthEvents : events;
        const index = pageEvents.findIndex(item => item.discord_message_id === event.discord_message_id);
        if (index >= 0) eventPages[mode] = Math.floor(index / EVENT_PAGE_SIZE) + 1;
        pendingEventScrollId = eventDomId(event);
        renderEventsView();
      });
      day.appendChild(eventButton);
    });
    if (dayEvents.length > 3) {
      const more = document.createElement('div');
      more.className = 'events-calendar-more';
      more.textContent = `他 ${dayEvents.length - 3}件`;
      day.appendChild(more);
    }
    grid.appendChild(day);
  }

  shell.appendChild(grid);
  return shell;
}

function buildPagination({ page, totalItems, pageSize, onPageChange }) {
  const totalPages = Math.max(1, Math.ceil(totalItems / pageSize));
  if (totalPages <= 1) return null;

  const nav = document.createElement('div');
  nav.className = 'pagination';

  const prev = document.createElement('button');
  prev.className = 'pagination-button';
  prev.type = 'button';
  prev.textContent = '前へ';
  prev.disabled = page <= 1;
  prev.addEventListener('click', () => onPageChange(page - 1));
  nav.appendChild(prev);

  const status = document.createElement('span');
  status.className = 'pagination-status';
  status.textContent = `${page} / ${totalPages}ページ`;
  nav.appendChild(status);

  const next = document.createElement('button');
  next.className = 'pagination-button';
  next.type = 'button';
  next.textContent = '次へ';
  next.disabled = page >= totalPages;
  next.addEventListener('click', () => onPageChange(page + 1));
  nav.appendChild(next);

  return nav;
}

function paginateItems(items, page, pageSize) {
  const totalPages = Math.max(1, Math.ceil(items.length / pageSize));
  const safePage = Math.min(Math.max(1, page), totalPages);
  const start = (safePage - 1) * pageSize;
  return {
    page: safePage,
    items: items.slice(start, start + pageSize),
  };
}

function renderEventsHeader(counts) {
  const header = document.getElementById('events-header');
  header.innerHTML = '';
  const switcher = document.createElement('div');
  switcher.id = 'events-switcher';
  [
    { value: 'calendar', label: `カレンダー ${counts.total}` },
    { value: 'upcoming', label: `開催予定 ${counts.upcoming}` },
    { value: 'past', label: `開催済み ${counts.past}` },
  ].forEach(item => {
    const tab = document.createElement('button');
    tab.className = 'events-switch-tab' + (activeEventsSection === item.value ? ' active' : '');
    tab.textContent = item.label;
    tab.addEventListener('click', () => {
      activeEventsSection = item.value;
      eventPages[activeEventsSection] = 1;
      renderEventsView();
    });
    switcher.appendChild(tab);
  });
  header.appendChild(switcher);
}

function renderEventsView() {
  const header = document.getElementById('events-header');
  const body = document.getElementById('events-body');
  header.innerHTML = '';
  body.innerHTML = '';
  if (communityEventsUnavailable) {
    const empty = document.createElement('div');
    empty.id = 'events-empty';
    empty.textContent = 'イベントデータの準備がまだ完了していません';
    body.appendChild(empty);
    return;
  }
  const now = new Date();
  const displayEvents = dedupeEvents(communityEvents);
  const upcoming = displayEvents
    .filter(event => isUpcomingEvent(event, now))
    .sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
  const past = displayEvents
    .filter(event => !isUpcomingEvent(event, now))
    .sort((a, b) => new Date(b.starts_at) - new Date(a.starts_at));

  renderEventsHeader({ total: displayEvents.length, upcoming: upcoming.length, past: past.length });
  const calendarEvents = displayEvents
    .filter(event => !event.cancelled_at)
    .sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
  const visibleEvents = activeEventsSection === 'calendar'
    ? calendarEvents.filter(event => {
      if (!eventCalendarMonths.calendar) eventCalendarMonths.calendar = defaultCalendarMonth(upcoming.length ? upcoming : calendarEvents, 'calendar');
      const date = new Date(event.starts_at);
      return !Number.isNaN(date.getTime()) && monthKey(date) === monthKey(eventCalendarMonths.calendar);
    })
    : activeEventsSection === 'upcoming'
      ? upcoming
      : past;

  if (activeEventsSection === 'calendar') {
    const calendar = renderEventCalendar(calendarEvents, activeEventsSection);
    if (calendar) body.appendChild(calendar);
    if (visibleEvents.length) {
      const title = document.createElement('div');
      title.className = 'events-section-title';
      title.textContent = 'この月のイベント';
      body.appendChild(title);
    }
  }

  const paginated = paginateItems(visibleEvents, eventPages[activeEventsSection], EVENT_PAGE_SIZE);
  eventPages[activeEventsSection] = paginated.page;
  paginated.items.forEach(event => body.appendChild(buildEventCard(event, activeEventsSection)));
  const pagination = buildPagination({
    page: paginated.page,
    totalItems: visibleEvents.length,
    pageSize: EVENT_PAGE_SIZE,
    onPageChange: nextPage => {
      eventPages[activeEventsSection] = nextPage;
      renderEventsView();
      document.getElementById('events-view').scrollTop = 0;
    },
  });
  if (pagination) body.appendChild(pagination);
  if (visibleEvents.length === 0) {
    const empty = document.createElement('div');
    empty.id = 'events-empty';
    empty.textContent = activeEventsSection === 'calendar'
      ? 'この月のイベントはありません'
      : activeEventsSection === 'upcoming'
      ? 'これから開催するイベントはありません'
      : '開催済みイベントはありません';
    body.appendChild(empty);
  }
  if (pendingEventScrollId) {
    const targetId = pendingEventScrollId;
    pendingEventScrollId = null;
    requestAnimationFrame(() => {
      const target = document.getElementById(targetId);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }
}

// ================================================================
// コミュニティ投稿(読んだ本・旅行・質問相談・note・お金の相談・介護医療・子育て・不動産)
// community_posts テーブルから読み込み、✕は member_tags/member_links と
// 同じくSupabase REST DELETE(anon key)で削除する(open-delete パターン)。
// テーブル未作成の環境では fetchCommunityPosts() が空配列にフォールバックする。
// ================================================================

const CONTENT_TYPE_META = {
  book: { label: '読んだ本', icon: '📚' },
  travel: { label: '旅行グルメ', icon: '✈️' },
  question_consultation: { label: '質問・相談', icon: '💬' },
  note: { label: 'note', icon: '📝' },
  money_consultation: { label: 'お金の相談', icon: '💰' },
  care_medical: { label: '介護・医療', icon: '🏥' },
  parenting: { label: '子育て', icon: '👶' },
  real_estate: { label: '不動産', icon: '🏠' },
};
const COMMUNITY_CONTENT_TYPE_ORDER = ['book', 'question_consultation', 'note', 'money_consultation', 'care_medical', 'parenting', 'real_estate'];
const DETAIL_CONTENT_TYPE_ORDER = ['book', 'travel'];

let communityPosts = [];

function formatCommunityPostMonth(value) {
  if (!value) return '';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return '';
  return new Intl.DateTimeFormat('ja-JP', {
    year: 'numeric',
    month: 'long',
  }).format(date);
}

function communityPostMonthSearchTerms(value) {
  if (!value) return [];
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return [];
  const year = date.getFullYear();
  const month = date.getMonth() + 1;
  const paddedMonth = String(month).padStart(2, '0');
  return [
    `${year}年${month}月`,
    `${year}/${month}`,
    `${year}/${paddedMonth}`,
    `${year}-${month}`,
    `${year}-${paddedMonth}`,
    `${year} ${month}`,
    `${year} ${paddedMonth}`,
    `${month}月`,
  ];
}

function canRemoveCommunityPost(post) {
  return post.content_type === 'book' || Boolean(post.member_nickname);
}

function buildCommunityPostCard(post, { onRemove }) {
  const card = document.createElement('div');
  card.className = 'community-post-card';

  if (canRemoveCommunityPost(post)) {
    const removeBtn = document.createElement('button');
    removeBtn.className = 'community-post-remove';
    removeBtn.textContent = '✕';
    removeBtn.title = 'この投稿を非表示にする';
    removeBtn.addEventListener('click', () => onRemove(post));
    card.appendChild(removeBtn);
  }

  if (post.title) {
    const title = document.createElement('div');
    title.className = 'community-post-title';
    title.textContent = post.title;
    card.appendChild(title);
  }

  const summary = document.createElement('div');
  summary.className = 'community-post-summary';
  summary.textContent = post.summary;
  card.appendChild(summary);

  const meta = document.createElement('div');
  meta.className = 'community-post-meta';
  // 相談系は複数人の議論スレッドであることが多く、またプライバシー配慮のため、
  // 投稿者名は単独投稿として扱う読んだ本・旅行に限定して表示する。
  const authorName = ['book', 'travel'].includes(post.content_type)
    ? (post.member_nickname || post.discord_author_display_name)
    : null;
  if (authorName) {
    const author = document.createElement('span');
    author.className = 'community-post-author';
    author.textContent = authorName;
    meta.appendChild(author);
  }
  const postedMonth = formatCommunityPostMonth(post.posted_at);
  if (postedMonth) {
    const date = document.createElement('span');
    date.className = 'community-post-date';
    date.textContent = postedMonth;
    meta.appendChild(date);
  }
  const link = document.createElement('a');
  link.className = 'community-post-permalink';
  link.href = post.discord_permalink;
  link.target = '_blank';
  link.rel = 'noopener';
  link.textContent = 'Discordで見る →';
  meta.appendChild(link);
  card.appendChild(meta);

  return card;
}

async function deleteCommunityPost(post) {
  const params = new URLSearchParams({ id: `eq.${post.id}` });
  await fetch(`${SUPABASE_URL}/rest/v1/community_posts?${params.toString()}`, {
    method: 'DELETE',
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
  });
  communityPosts = communityPosts.filter(p => p.id !== post.id);
  if (post.content_type === 'travel') removeTravelPostMarker(post);
  renderCommunityView();
  if (document.getElementById('member-detail-view').style.display === 'block') {
    const match = location.hash.match(/^#member\/(.+)$/);
    if (match) openMemberDetail(decodeURIComponent(match[1]), { updateHash: false });
  }
}

let activeCommunityType = null; // null = すべて
let communityQuery = '';
const COMMUNITY_PAGE_SIZE = 10;
let communityPage = 1;

function matchesCommunityQuery(post, query) {
  const q = query.trim().toLowerCase();
  if (!q) return true;
  const authorFields = ['book', 'travel'].includes(post.content_type)
    ? [post.member_nickname, post.discord_author_display_name]
    : [];
  const haystack = [post.title, post.summary, ...authorFields, ...communityPostMonthSearchTerms(post.posted_at)]
    .filter(Boolean).join(' ').toLowerCase();
  return haystack.includes(q);
}

function filteredCommunityPosts() {
  const typesToShow = activeCommunityType ? [activeCommunityType] : COMMUNITY_CONTENT_TYPE_ORDER;
  return typesToShow.flatMap(type => (
    communityPosts
      .filter(p => p.content_type === type && matchesCommunityQuery(p, communityQuery))
      .sort((a, b) => (a.posted_at < b.posted_at ? 1 : -1))
  ));
}

function renderCommunityView() {
  const header = document.getElementById('community-header');
  header.innerHTML = '';

  const searchWrap = document.createElement('div');
  searchWrap.id = 'community-search-wrap';
  const searchInput = document.createElement('input');
  searchInput.id = 'community-search';
  searchInput.type = 'text';
  searchInput.placeholder = 'タイトル・本文・投稿者・年月で検索…';
  searchInput.autocomplete = 'off';
  searchInput.value = communityQuery;
  const searchClear = document.createElement('button');
  searchClear.id = 'community-search-clear';
  searchClear.textContent = '✕';
  searchClear.style.display = communityQuery ? 'block' : 'none';
  searchInput.addEventListener('input', () => {
    communityQuery = searchInput.value;
    communityPage = 1;
    searchClear.style.display = communityQuery ? 'block' : 'none';
    renderCommunityBody();
  });
  searchClear.addEventListener('click', () => {
    communityQuery = '';
    communityPage = 1;
    searchInput.value = '';
    searchClear.style.display = 'none';
    searchInput.focus();
    renderCommunityBody();
  });
  searchWrap.appendChild(searchInput);
  searchWrap.appendChild(searchClear);
  header.appendChild(searchWrap);

  const pillRow = document.createElement('div');
  pillRow.id = 'community-pill-row';
  const allPill = document.createElement('button');
  allPill.className = 'community-type-pill' + (activeCommunityType === null ? ' active' : '');
  allPill.textContent = 'すべて';
  allPill.addEventListener('click', () => { activeCommunityType = null; communityPage = 1; renderCommunityView(); });
  pillRow.appendChild(allPill);
  COMMUNITY_CONTENT_TYPE_ORDER.forEach(type => {
    const meta = CONTENT_TYPE_META[type];
    const pill = document.createElement('button');
    pill.className = 'community-type-pill' + (activeCommunityType === type ? ' active' : '');
    pill.textContent = `${meta.icon} ${meta.label}`;
    pill.addEventListener('click', () => { activeCommunityType = type; communityPage = 1; renderCommunityView(); });
    pillRow.appendChild(pill);
  });
  header.appendChild(pillRow);

  renderCommunityBody();
}

function renderCommunityBody() {
  const body = document.getElementById('community-body');
  body.innerHTML = '';

  const posts = filteredCommunityPosts();
  const paginated = paginateItems(posts, communityPage, COMMUNITY_PAGE_SIZE);
  communityPage = paginated.page;
  let lastType = null;

  paginated.items.forEach(post => {
    if (post.content_type !== lastType) {
      const title = document.createElement('div');
      title.className = 'community-section-title';
      title.textContent = `${CONTENT_TYPE_META[post.content_type].icon} ${CONTENT_TYPE_META[post.content_type].label}`;
      body.appendChild(title);
      lastType = post.content_type;
    }
    body.appendChild(buildCommunityPostCard(post, { onRemove: deleteCommunityPost }));
  });

  const pagination = buildPagination({
    page: paginated.page,
    totalItems: posts.length,
    pageSize: COMMUNITY_PAGE_SIZE,
    onPageChange: nextPage => {
      communityPage = nextPage;
      renderCommunityBody();
      document.getElementById('community-view').scrollTop = 0;
    },
  });
  if (pagination) body.appendChild(pagination);

  if (posts.length === 0) {
    const empty = document.createElement('div');
    empty.id = 'community-empty';
    empty.textContent = activeCommunityType
      ? 'このカテゴリの投稿はまだ登録されていません'
      : '表示できる投稿がありません';
    body.appendChild(empty);
  }
}

function buildCommunityPostsSection(member) {
  const wrap = document.createElement('div');
  const memberPosts = communityPosts.filter(p => p.member_nickname === member.nickname);
  if (!memberPosts.length) return wrap;

  DETAIL_CONTENT_TYPE_ORDER.forEach(type => {
    const posts = memberPosts.filter(p => p.content_type === type);
    if (!posts.length) return;

    const section = document.createElement('div');
    section.className = 'detail-section';
    const title = document.createElement('div');
    title.className = 'detail-section-title';
    title.textContent = `${CONTENT_TYPE_META[type].icon} ${CONTENT_TYPE_META[type].label}`;
    section.appendChild(title);

    const list = document.createElement('div');
    list.className = 'detail-community-list';
    posts.forEach(post => {
      const item = document.createElement('div');
      item.className = 'detail-community-item';

      const removeBtn = document.createElement('button');
      removeBtn.className = 'detail-community-remove';
      removeBtn.textContent = '✕';
      removeBtn.title = '非表示にする';
      removeBtn.addEventListener('click', () => deleteCommunityPost(post));
      item.appendChild(removeBtn);

      if (post.title) {
        const itemTitle = document.createElement('div');
        itemTitle.className = 'detail-community-title';
        itemTitle.textContent = post.title;
        item.appendChild(itemTitle);
      }

      const summary = document.createElement('div');
      summary.className = 'detail-community-summary';
      summary.textContent = post.summary;
      item.appendChild(summary);

      const link = document.createElement('a');
      link.className = 'detail-community-link';
      link.href = post.discord_permalink;
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = 'Discordで見る →';
      item.appendChild(link);

      list.appendChild(item);
    });
    section.appendChild(list);
    wrap.appendChild(section);
  });

  return wrap;
}
