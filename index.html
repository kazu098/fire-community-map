// 特定日の空き時間の例外登録(曜日パターンとは別に、向こう1か月ほどの特定日だけ1時間単位で
// ○/×を登録したいメンバー向け)。itチームのDiscordでの相談(2026-09-14/15、Hiro-shi@GLさんの
// 提案)を踏まえた機能。曜日×時間帯(午前/午後/夜)の毎週パターンはアプリ全体を1時間刻みにする
// ほどの負担はかけたくない一方、特定日の例外だけは1時間単位で指定できると便利、という要望に
// 合わせている。詳細は docs/yuru-matching.md 参照。
function formatOverrideDate(dateStr) {
  const d = new Date(`${dateStr}T00:00:00`);
  if (Number.isNaN(d.getTime())) return dateStr;
  const weekday = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
  return `${d.getMonth() + 1}/${d.getDate()}(${weekday})`;
}

// 1回のドラッグ操作で複数時間をまとめて登録/削除するためのバッチ版。
// 単一時間の登録/削除もこのバッチ版を1件で呼ぶ形に統一している。
async function addAvailabilityOverrideBatch(nickname, dateStr, hours, isAvailable) {
  if (hours.length === 0) return true;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/member_availability_overrides?on_conflict=member_nickname,override_date,hour`, {
    method: 'POST',
    headers: {
      ...authHeaders(),
      'Content-Type': 'application/json',
      Prefer: 'resolution=merge-duplicates,return=minimal',
    },
    body: JSON.stringify(hours.map(hour => ({
      member_nickname: nickname, override_date: dateStr, hour, is_available: isAvailable,
    }))),
  });
  if (!res.ok) {
    console.warn('availability override save failed', res.status, await res.text());
    return false;
  }
  const member = directoryMembers.find(m => m.nickname === nickname);
  if (member) {
    const hourSet = new Set(hours);
    member.availabilityOverrides = member.availabilityOverrides.filter(
      a => !(a.override_date === dateStr && hourSet.has(a.hour))
    );
    hours.forEach(hour => member.availabilityOverrides.push({ override_date: dateStr, hour, is_available: isAvailable }));
  }
  return true;
}

async function deleteAvailabilityOverrideBatch(nickname, dateStr, hours) {
  if (hours.length === 0) return true;
  const params = new URLSearchParams({
    member_nickname: `eq.${nickname}`,
    override_date: `eq.${dateStr}`,
    hour: `in.(${hours.join(',')})`,
  });
  const res = await fetch(`${SUPABASE_URL}/rest/v1/member_availability_overrides?${params.toString()}`, {
    method: 'DELETE',
    headers: authHeaders(),
  });
  if (!res.ok) {
    console.warn('availability override delete failed', res.status, await res.text());
    return false;
  }
  const member = directoryMembers.find(m => m.nickname === nickname);
  if (member) {
    const hourSet = new Set(hours);
    member.availabilityOverrides = member.availabilityOverrides.filter(
      a => !(a.override_date === dateStr && hourSet.has(a.hour))
    );
  }
  return true;
}

async function deleteAvailabilityOverride(nickname, dateStr, hour) {
  return deleteAvailabilityOverrideBatch(nickname, dateStr, [hour]);
}

function buildAvailabilityOverrideSection(member, { editable }) {
  const overrides = [...member.availabilityOverrides].sort(
    (a, b) => a.override_date.localeCompare(b.override_date) || a.hour - b.hour
  );
  if (!editable && overrides.length === 0) return null;

  // addAvailabilityOverrideBatch/deleteAvailabilityOverrideBatch は member.availabilityOverrides
  // (実データ)を更新するだけなので、その内容を描画に使っているローカルの overrides 配列にも
  // 反映させる。これを忘れるとネットワーク保存自体は成功するのにチップ一覧や別日付のグリッドが
  // 画面上だけ古いまま(再読み込みするまで反映されない)というバグになる。
  function syncOverrides() {
    overrides.length = 0;
    overrides.push(...[...member.availabilityOverrides].sort(
      (a, b) => a.override_date.localeCompare(b.override_date) || a.hour - b.hour
    ));
  }

  const wrap = document.createElement('div');
  wrap.className = 'availability-override-section';
  const title = document.createElement('div');
  title.className = 'availability-override-title';
  title.textContent = '特定日の例外(オプション・1時間単位)';
  wrap.appendChild(title);

  const hint = document.createElement('div');
  hint.className = 'detail-field-hint';
  hint.textContent = editable
    ? '曜日パターンと違う日だけ、日付を選んでマスをクリックすると1時間単位で空き/不可を登録できます(向こう1か月ほどが目安)。'
    : '曜日パターンとは別に登録されている特定日・1時間単位の空き/不可です。';
  wrap.appendChild(hint);

  const list = document.createElement('div');
  list.className = 'availability-override-list';
  wrap.appendChild(list);

  let renderGrid = () => {};

  // 同じ日付・同じ○/×が連続する時間は、10時,11時,12時,13時のように1つずつチップにすると
  // 項目数が多くなりすぎるため、10:00〜14:00のように1本の範囲チップへまとめて表示する。
  function buildOverrideRanges() {
    const ranges = [];
    let current = null;
    overrides.forEach(o => {
      if (
        current
        && current.override_date === o.override_date
        && current.is_available === o.is_available
        && current.endHour === o.hour - 1
      ) {
        current.endHour = o.hour;
        current.hours.push(o.hour);
      } else {
        current = {
          override_date: o.override_date, is_available: o.is_available,
          startHour: o.hour, endHour: o.hour, hours: [o.hour],
        };
        ranges.push(current);
      }
    });
    return ranges;
  }

  function renderList() {
    list.innerHTML = '';
    buildOverrideRanges().forEach(range => {
      const chip = document.createElement('span');
      chip.className = `availability-override-chip ${range.is_available ? 'is-available' : 'is-unavailable'}`;
      const timeLabel = range.startHour === range.endHour
        ? `${range.startHour}:00`
        : `${range.startHour}:00〜${range.endHour + 1}:00`;
      chip.appendChild(document.createTextNode(
        `${formatOverrideDate(range.override_date)} ${timeLabel} ${range.is_available ? '○' : '×'}`
      ));
      if (editable) {
        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.textContent = '✕';
        removeBtn.title = '削除';
        removeBtn.addEventListener('click', async () => {
          removeBtn.disabled = true;
          const ok = await deleteAvailabilityOverrideBatch(member.nickname, range.override_date, range.hours);
          if (ok) {
            syncOverrides();
            renderList();
            renderGrid();
          } else {
            removeBtn.disabled = false;
          }
        });
        chip.appendChild(removeBtn);
      }
      list.appendChild(chip);
    });
  }
  renderList();

  if (!editable) return wrap;

  let paintMode = 'available';

  const modeRow = document.createElement('div');
  modeRow.className = 'availability-override-mode-row';
  const modeLabel = document.createElement('span');
  modeLabel.className = 'detail-field-hint';
  modeLabel.textContent = 'クリックで登録する内容:';
  modeRow.appendChild(modeLabel);
  const modeButtons = [];
  [{ mode: 'available', label: '○ 空きあり' }, { mode: 'unavailable', label: '× 予定あり(不可)' }].forEach(opt => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = `availability-override-mode-btn${paintMode === opt.mode ? ' is-active' : ''}`;
    btn.dataset.mode = opt.mode;
    btn.textContent = opt.label;
    btn.addEventListener('click', () => {
      paintMode = opt.mode;
      modeButtons.forEach(b => b.classList.toggle('is-active', b.dataset.mode === paintMode));
    });
    modeButtons.push(btn);
    modeRow.appendChild(btn);
  });
  wrap.appendChild(modeRow);

  const form = document.createElement('div');
  form.className = 'availability-override-form';

  const dateInput = document.createElement('input');
  dateInput.type = 'date';
  const today = new Date();
  dateInput.value = today.toISOString().slice(0, 10);
  dateInput.min = today.toISOString().slice(0, 10);
  const maxDate = new Date(today);
  maxDate.setDate(maxDate.getDate() + 42);
  dateInput.max = maxDate.toISOString().slice(0, 10);
  form.appendChild(dateInput);
  wrap.appendChild(form);

  const gridHint = document.createElement('div');
  gridHint.className = 'detail-field-hint';
  gridHint.textContent = 'マスをドラッグすると複数時間まとめて登録できます。';
  wrap.appendChild(gridHint);

  const grid = document.createElement('div');
  grid.className = 'availability-override-hour-grid';
  wrap.appendChild(grid);

  const formStatus = document.createElement('span');
  formStatus.className = 'matching-status';
  wrap.appendChild(formStatus);

  // ドラッグで複数マスをまとめて塗る。最初にクリックしたマスの状態で「今回のドラッグは
  // 登録するのか解除するのか」を決め、ドラッグ中に通ったマスすべてに同じ操作を適用する
  // (ペイントツールと同じ考え方)。実際の保存はマスを離した時に1回のバッチAPI呼び出しで行う。
  let dragState = null;

  function cellVisualState(dateStr, hour) {
    return overrides.find(o => o.override_date === dateStr && o.hour === hour);
  }

  function paintCell(cell, isAvailable) {
    cell.classList.remove('is-available', 'is-unavailable');
    cell.classList.add(isAvailable ? 'is-available' : 'is-unavailable');
  }
  function unpaintCell(cell) {
    cell.classList.remove('is-available', 'is-unavailable');
  }

  function finishDrag() {
    if (!wrap.isConnected) {
      document.removeEventListener('mouseup', finishDrag);
      dragState = null;
      return;
    }
    if (!dragState) return;
    const { action, dateStr, hours, wantAvailable } = dragState;
    dragState = null;
    const hourList = [...hours];
    (async () => {
      formStatus.textContent = '保存中...';
      const ok = action === 'set'
        ? await addAvailabilityOverrideBatch(member.nickname, dateStr, hourList, wantAvailable)
        : await deleteAvailabilityOverrideBatch(member.nickname, dateStr, hourList);
      formStatus.textContent = ok ? '保存しました' : '保存できませんでした';
      if (ok) syncOverrides();
      renderGrid();
      renderList();
    })();
  }
  document.addEventListener('mouseup', finishDrag);

  renderGrid = function renderGridImpl() {
    grid.innerHTML = '';
    const dateStr = dateInput.value;
    MATCHING_HOURS.forEach(hour => {
      const existing = cellVisualState(dateStr, hour);
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'availability-override-hour-cell';
      if (existing) cell.classList.add(existing.is_available ? 'is-available' : 'is-unavailable');
      cell.textContent = String(hour);
      cell.title = `${hour}:00〜${hour + 1}:00`;
      cell.addEventListener('mousedown', e => {
        e.preventDefault();
        const wantAvailable = paintMode === 'available';
        const cur = cellVisualState(dateStr, hour);
        const action = (cur && cur.is_available === wantAvailable) ? 'clear' : 'set';
        dragState = { action, dateStr, wantAvailable, hours: new Set([hour]) };
        if (action === 'set') paintCell(cell, wantAvailable); else unpaintCell(cell);
      });
      cell.addEventListener('mouseenter', () => {
        if (!dragState || dragState.dateStr !== dateStr) return;
        dragState.hours.add(hour);
        if (dragState.action === 'set') paintCell(cell, dragState.wantAvailable); else unpaintCell(cell);
      });
      grid.appendChild(cell);
    });
  };
  dateInput.addEventListener('change', () => renderGrid());
  renderGrid();

  return wrap;
}

// ---- 話してみたい人リスト(本人だけが見える・ゆるマッチングの組み合わせに反映される) ----

let talkWishes = null; // 自分の登録(target_nicknameの配列)。未取得はnull
onAuthStateChanged(() => { talkWishes = null; }); // ログイン/ログアウトで別人の一覧を引きずらない

async function loadTalkWishes() {
  if (talkWishes) return talkWishes;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/member_talk_wishes?select=target_nickname&order=created_at`,
      { headers: authHeaders() });
    talkWishes = res.ok ? (await res.json()).map(r => r.target_nickname) : [];
  } catch (e) {
    console.warn('talk wishes load failed', e);
    talkWishes = [];
  }
  return talkWishes;
}

async function addTalkWish(me, target) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/member_talk_wishes?on_conflict=member_nickname,target_nickname`, {
    method: 'POST',
    headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'resolution=ignore-duplicates,return=minimal' }),
    body: JSON.stringify([{ member_nickname: me, target_nickname: target }]),
  });
  if (!res.ok) { console.warn('talk wish add failed', res.status, await res.text()); return false; }
  if (!talkWishes.includes(target)) talkWishes.push(target);
  return true;
}

async function removeTalkWish(me, target) {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/member_talk_wishes?member_nickname=eq.${encodeURIComponent(me)}&target_nickname=eq.${encodeURIComponent(target)}`,
    { method: 'DELETE', headers: authHeaders({ Prefer: 'return=minimal' }) });
  if (!res.ok) { console.warn('talk wish remove failed', res.status, await res.text()); return false; }
  talkWishes = talkWishes.filter(n => n !== target);
  return true;
}

function buildTalkWishSection(member) {
  const section = document.createElement('div');
  section.className = 'talk-wish-section';
  const title = document.createElement('div');
  title.className = 'talk-wish-title';
  title.textContent = '話してみたい人';
  section.appendChild(title);
  const hint = document.createElement('div');
  hint.className = 'detail-field-hint';
  hint.textContent = '名前を入力して選ぶと追加できます。この一覧は自分だけに表示され、相手には伝わりません。ゆるマッチングでは、登録した人となるべく同じグループになるように組み合わせます(参加ONで空き時間が合う人に限ります)。';
  section.appendChild(hint);

  const box = document.createElement('div');
  box.className = 'talk-wish-box';
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'talk-wish-input';
  input.placeholder = 'ニックネームで検索して追加';
  input.autocomplete = 'off';
  const suggest = document.createElement('ul');
  suggest.className = 'talk-wish-suggest';
  suggest.style.display = 'none';
  const status = document.createElement('div');
  status.className = 'matching-status';

  let activeIndex = 0;
  let options = [];

  function renderChips() {
    box.querySelectorAll('.talk-wish-chip').forEach(el => el.remove());
    (talkWishes || []).forEach(target => {
      const chip = document.createElement('span');
      chip.className = 'talk-wish-chip';
      chip.appendChild(document.createTextNode(target));
      const x = document.createElement('button');
      x.type = 'button';
      x.setAttribute('aria-label', `${target}を外す`);
      x.textContent = '×';
      x.addEventListener('click', async () => {
        status.textContent = '保存中...';
        const ok = await removeTalkWish(member.nickname, target);
        status.textContent = ok ? '外しました' : '保存できませんでした';
        renderChips();
      });
      chip.appendChild(x);
      box.insertBefore(chip, input);
    });
  }

  function renderSuggest() {
    const q = input.value.trim().toLowerCase();
    suggest.innerHTML = '';
    if (!q) { suggest.style.display = 'none'; options = []; return; }
    const taken = new Set(talkWishes || []);
    options = directoryMembers
      .filter(m => m.nickname !== member.nickname && !taken.has(m.nickname) && m.nickname.toLowerCase().includes(q))
      .sort((a, b) => Number(b.nickname.toLowerCase().startsWith(q)) - Number(a.nickname.toLowerCase().startsWith(q)))
      .slice(0, 8);
    activeIndex = 0;
    if (options.length === 0) {
      const li = document.createElement('li');
      li.textContent = '該当するメンバーがいません';
      li.style.color = '#9ca3af';
      li.style.cursor = 'default';
      suggest.appendChild(li);
    }
    options.forEach((m, i) => {
      const li = document.createElement('li');
      li.textContent = m.nickname;
      if (i === activeIndex) li.classList.add('is-active');
      // blurより先に選択できるよう mousedown で処理する
      li.addEventListener('mousedown', e => { e.preventDefault(); pick(m.nickname); });
      suggest.appendChild(li);
    });
    suggest.style.display = 'block';
  }

  async function pick(nickname) {
    input.value = '';
    suggest.style.display = 'none';
    status.textContent = '保存中...';
    const ok = await addTalkWish(member.nickname, nickname);
    status.textContent = ok ? `${nickname} さんを追加しました` : '保存できませんでした';
    renderChips();
    input.focus();
  }

  input.addEventListener('input', renderSuggest);
  input.addEventListener('focus', renderSuggest);
  input.addEventListener('blur', () => { suggest.style.display = 'none'; });
  input.addEventListener('keydown', e => {
    if (e.isComposing) return; // 日本語入力の変換確定のEnterでは追加しない
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!options.length) return;
      e.preventDefault();
      activeIndex = (activeIndex + (e.key === 'ArrowDown' ? 1 : options.length - 1)) % options.length;
      [...suggest.children].forEach((li, i) => li.classList.toggle('is-active', i === activeIndex));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (options[activeIndex]) pick(options[activeIndex].nickname);
    } else if (e.key === 'Escape') {
      suggest.style.display = 'none';
    } else if (e.key === 'Backspace' && !input.value && talkWishes && talkWishes.length) {
      removeTalkWish(member.nickname, talkWishes[talkWishes.length - 1]).then(renderChips);
    }
  });

  box.appendChild(input);
  box.appendChild(suggest);
  section.appendChild(box);
  section.appendChild(status);
  loadTalkWishes().then(renderChips);
  return section;
}

        grid.appendChild(head);
      });
      MATCHING_DAYS.forEach(day => {
        const dayLabel = document.createElement('div');
        dayLabel.className = 'availability-day-label';
        dayLabel.textContent = day.label;
        grid.appendChild(dayLabel);
        MATCHING_HOURS.forEach(hour => {
          const isOn = member.availability.some(a => a.day_of_week === day.key && a.hour === hour);
          const cell = document.createElement('div');
          cell.className = `availability-cell readonly${isOn ? ' is-on' : ''}`;
          grid.appendChild(cell);
        });
      });
      scroll.appendChild(grid);
      section.appendChild(scroll);
    }
    const readonlyOverrideSection = buildAvailabilityOverrideSection(member, { editable: false });
    if (readonlyOverrideSection) section.appendChild(readonlyOverrideSection);
    return section;
  }

  const status = document.createElement('div');
  status.className = 'matching-status';

  const optInRow = document.createElement('div');
  optInRow.className = 'matching-opt-in-row';
  const optInCopy = document.createElement('div');
  optInCopy.className = 'public-toggle-copy';
  const optInLabel = document.createElement('div');
  optInLabel.className = 'public-toggle-label';
  optInLabel.textContent = 'マッチングに参加する';
  optInCopy.appendChild(optInLabel);
  optInRow.appendChild(optInCopy);
  const optInToggle = document.createElement('button');
  optInToggle.type = 'button';
  optInToggle.className = `public-toggle${isOptedIn ? ' is-on' : ''}`;
  optInToggle.setAttribute('aria-pressed', String(isOptedIn));
  const optInState = document.createElement('span');
  optInState.textContent = isOptedIn ? 'ON' : 'OFF';
  optInToggle.appendChild(optInState);
  optInToggle.addEventListener('click', async () => {
    optInToggle.disabled = true;
    status.textContent = '保存中...';
    const nextValue = !isOptedIn;
    const ok = await upsertMatchingSettings(member.nickname, { opted_in: nextValue });
    status.textContent = ok ? '保存しました' : '';
    openMemberDetail(member.nickname, { updateHash: false, scrollToTop: false });
  });
  optInRow.appendChild(optInToggle);
  section.appendChild(optInRow);

  const frequencyRow = document.createElement('div');
  frequencyRow.className = 'matching-frequency-row';
  const frequencyLabel = document.createElement('label');
  frequencyLabel.textContent = 'マッチング頻度';
  frequencyLabel.setAttribute('for', 'matching-frequency-select');
  const frequencySelect = document.createElement('select');
  frequencySelect.id = 'matching-frequency-select';
  frequencySelect.className = 'matching-frequency-select';
  MATCHING_INTERVAL_OPTIONS.forEach(opt => {
    const option = document.createElement('option');
    option.value = String(opt.days);
    option.textContent = opt.label;
    if (member.matching.interval_days === opt.days) option.selected = true;
    frequencySelect.appendChild(option);
  });
  frequencySelect.addEventListener('change', async () => {
    status.textContent = '保存中...';
    const ok = await upsertMatchingSettings(member.nickname, { interval_days: Number(frequencySelect.value) });
    status.textContent = ok ? '保存しました' : '';
  });
  frequencyRow.appendChild(frequencyLabel);
  frequencyRow.appendChild(frequencySelect);
  section.appendChild(frequencyRow);

  const scroll = document.createElement('div');
  scroll.className = 'availability-grid-scroll';
  const grid = document.createElement('div');
  grid.className = 'availability-grid';
  grid.appendChild(buildAvailabilityCornerCell());
  MATCHING_HOURS.forEach(hour => {
    const head = document.createElement('div');
    head.className = 'availability-head';
    head.textContent = String(hour);
    grid.appendChild(head);
  });

  // 曜日×時間帯(旧: 午前/午後/夜)の3マス程度ならクリック連打でも良かったが、1時間刻み
  // (7〜23時 x 7曜日 = 119マス)になったので、特定日の例外グリッドと同じドラッグ・ペイント
  // 方式にしている。mousedownで最初のマスの状態から「今回は登録するのか解除するのか」を
  // 決め、ドラッグ中に通ったマス(複数の曜日をまたいでもよい)すべてに同じ操作を適用し、
  // マスを離した時に曜日ごとにまとめて1回のバッチAPI呼び出しで保存する。ドラッグせず
  // 1マスだけクリックした場合もこの仕組みの中で単なる1マスのドラッグとして扱われる。
  let dragState = null;
  const cellsByKey = new Map();

  function cellKey(dayKey, hour) { return `${dayKey}:${hour}`; }

  function paintCell(cell, on) {
    cell.classList.toggle('is-on', on);
    cell.textContent = on ? '○' : '×';
    cell.title = on ? 'クリックで「空きなし」に変更' : 'クリックで「空きあり」に変更';
    cell.setAttribute('aria-pressed', String(on));
  }

  function syncGridFromSource() {
    cellsByKey.forEach((cell, key) => {
      const [dayKey, hourStr] = key.split(':');
      const isOn = member.availability.some(a => a.day_of_week === dayKey && a.hour === Number(hourStr));
      paintCell(cell, isOn);
    });
  }

  function finishDrag() {
    if (!grid.isConnected) {
      document.removeEventListener('mouseup', finishDrag);
      dragState = null;
      return;
    }
    if (!dragState) return;
    const { wantOn, byDay } = dragState;
    dragState = null;
    (async () => {
      status.textContent = '保存中...';
      let ok = true;
      for (const [dayKey, hours] of byDay.entries()) {
        const result = await toggleAvailabilityBatch(member.nickname, dayKey, [...hours], wantOn);
        if (!result) ok = false;
      }
      status.textContent = ok ? '保存しました' : '保存できませんでした';
      syncGridFromSource();
    })();
  }
  document.addEventListener('mouseup', finishDrag);

  MATCHING_DAYS.forEach(day => {
    const dayLabel = document.createElement('div');
    dayLabel.className = 'availability-day-label';
    dayLabel.textContent = day.label;
    grid.appendChild(dayLabel);
    MATCHING_HOURS.forEach(hour => {
      const isOn = member.availability.some(a => a.day_of_week === day.key && a.hour === hour);
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = `availability-cell${isOn ? ' is-on' : ''}`;
      cell.textContent = isOn ? '○' : '×';
      cell.title = isOn ? 'クリックで「空きなし」に変更' : 'クリックで「空きあり」に変更';
      cell.setAttribute('aria-pressed', String(isOn));
      cellsByKey.set(cellKey(day.key, hour), cell);
      cell.addEventListener('mousedown', e => {
        e.preventDefault();
        const wantOn = !cell.classList.contains('is-on');
        dragState = { wantOn, byDay: new Map([[day.key, new Set([hour])]]) };
        paintCell(cell, wantOn);
      });
      cell.addEventListener('mouseenter', () => {
        if (!dragState) return;
        if (!dragState.byDay.has(day.key)) dragState.byDay.set(day.key, new Set());
        dragState.byDay.get(day.key).add(hour);
        paintCell(cell, dragState.wantOn);
      });
      grid.appendChild(cell);
    });
  });
  scroll.appendChild(grid);
  section.appendChild(scroll);
  const legend = document.createElement('div');
  legend.className = 'availability-legend';
  legend.textContent = 'マスをクリック、またはドラッグすると ○（空きあり）/ ×（空きなし）が切り替わります。';
  section.appendChild(legend);
  section.appendChild(status);

  section.appendChild(buildAvailabilityOverrideSection(member, { editable: true }));
  section.appendChild(buildTalkWishSection(member));

  return section;
}

function buildIntroSection(member) {
  const section = document.createElement('div');
  section.className = 'detail-section';

  const headerRow = document.createElement('div');
  headerRow.className = 'detail-section-header-row';
  const title = document.createElement('div');
  title.className = 'detail-section-title';
  title.textContent = '自己紹介';
  headerRow.appendChild(title);
  const iconBtn = document.createElement('button');
  iconBtn.className = 'intro-icon-btn';
  headerRow.appendChild(iconBtn);
  section.appendChild(headerRow);

  const body = document.createElement('div');
  section.appendChild(body);

  let editMode = false;

  function renderBody() {
    body.innerHTML = '';

    iconBtn.style.display = editMode ? 'none' : 'inline-flex';
    iconBtn.textContent = member.self_intro_text ? '編集' : '＋追加';
    iconBtn.title = member.self_intro_text ? '自己紹介を編集' : '自己紹介を追加';
    iconBtn.onclick = () => { editMode = true; renderBody(); };

    if (editMode) {
      const textarea = document.createElement('textarea');
      textarea.id = 'detail-intro-textarea';
      textarea.value = member.self_intro_text || '';
      textarea.placeholder = '自己紹介を入力してください…';
      body.appendChild(textarea);
      requestAnimationFrame(() => autoGrowTextarea(textarea, 300));
      textarea.addEventListener('input', () => autoGrowTextarea(textarea, 300));

      const actions = document.createElement('div');
      actions.className = 'intro-edit-actions';
      const saveBtn = document.createElement('button');
      saveBtn.className = 'intro-save-btn';
      saveBtn.textContent = '保存';
      saveBtn.addEventListener('click', () => saveIntro(member.nickname, textarea.value));
      actions.appendChild(saveBtn);
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'intro-cancel-btn';
      cancelBtn.textContent = 'キャンセル';
      cancelBtn.addEventListener('click', () => { editMode = false; renderBody(); });
      actions.appendChild(cancelBtn);
      body.appendChild(actions);
      return;
    }

    if (!member.self_intro_text) {
      const placeholder = document.createElement('div');
      placeholder.className = 'intro-placeholder';
      placeholder.textContent = '自己紹介はまだ登録されていません。右上の＋から追加できます。';
      body.appendChild(placeholder);
      return;
    }

    const text = document.createElement('div');
    text.id = 'detail-intro-text';
    text.textContent = member.self_intro_text;
    body.appendChild(text);

    if (member.self_intro_url) {
      const link = document.createElement('a');
      link.id = 'detail-intro-link';
      link.href = member.self_intro_url;
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = 'Discordで元の投稿を見る ↗';
      body.appendChild(link);
    }
  }

  renderBody();
  return section;
}

function openMemberDetail(nickname, {
  updateHash = true,
  publicSettingsOpen = false,
  externalIntroPreviewOpen = false,
  scrollToTop = true,
  openConsultation = false,
  tab = null,
} = {}) {
  const member = directoryMembers.find(m => m.nickname === nickname);
  if (!member) return;

  document.getElementById('member-grid-view').style.display = 'none';
  document.getElementById('member-detail-view').style.display = 'block';
  if (scrollToTop) window.scrollTo(0, 0);
  if (updateHash) history.pushState(null, '', `#member/${encodeURIComponent(nickname)}`);

  const content = document.getElementById('detail-content');
  content.innerHTML = '';
  const readonly = !canEditMember(member.nickname);
  content.classList.toggle('detail-readonly', readonly);
  if (readonly) {
    const note = document.createElement('p');
    note.className = 'detail-readonly-note';
    note.textContent = '自分のプロフィールだけ編集できます。';
    content.appendChild(note);
  }

  const head = document.createElement('div');
  head.id = 'detail-head';
  const avatar = document.createElement('div');
  avatar.id = 'detail-avatar';
  avatar.style.background = memberColor(member.nickname);
  if (member.avatar_url) {
    const img = document.createElement('img');
    img.src = member.avatar_url;
    avatar.appendChild(img);
  } else {
    avatar.textContent = initials(member.nickname);
  }
  const nameEl = document.createElement('div');
  nameEl.id = 'detail-nickname';
  nameEl.textContent = member.nickname;
  const copyLinkBtn = document.createElement('button');
  copyLinkBtn.id = 'detail-copy-link';
  copyLinkBtn.textContent = '🔗 リンクをコピー';
  copyLinkBtn.addEventListener('click', () => {
    const url = `${location.origin}${location.pathname}#member/${encodeURIComponent(member.nickname)}`;
    navigator.clipboard.writeText(url).then(() => {
      copyLinkBtn.textContent = 'コピーしました';
      setTimeout(() => { copyLinkBtn.textContent = '🔗 リンクをコピー'; }, 2000);
    }).catch(() => {
      window.prompt('コピーできませんでした。下のURLを手動でコピーしてください', url);
    });
  });
  const nameBlock = document.createElement('div');
  nameBlock.id = 'detail-name-block';
  nameBlock.appendChild(nameEl);
  const joinedLabel = joinedMonthLabel(member.joined_month);
  if (joinedLabel) {
    const joinedEl = document.createElement('div');
    joinedEl.id = 'detail-joined';
    joinedEl.textContent = `${joinedLabel}入会`;
    nameBlock.appendChild(joinedEl);
  }
  head.appendChild(avatar);
  head.appendChild(nameBlock);
  head.appendChild(copyLinkBtn);
  content.appendChild(head);

  // プロフィール / ゆるマッチング / 投稿 の3タブ(issue #328)。保存後の再描画でも同じ
  // メンバーなら開いていたタブのまま、別のメンバーを開いたらプロフィールから。
  if (detailTabNickname !== member.nickname) {
    detailTab = 'profile';
    detailTabNickname = member.nickname;
    detailOpenFolds.clear();
  }
  if (tab) detailTab = tab;
  if (openConsultation || publicSettingsOpen) detailTab = 'profile';
  const panes = buildDetailTabs(content);
  const profilePane = panes.profile;

  // 他人のページでは「相談してみる」をプロフィールタブの先頭に置く。
  if (member.nickname !== myNickname) {
    const consultationSection = buildConsultationSection(member, { autoOpen: openConsultation });
    profilePane.appendChild(consultationSection);
    if (openConsultation) {
      requestAnimationFrame(() => consultationSection.scrollIntoView({ behavior: 'smooth', block: 'start' }));
    }
  }

  CATEGORY_ORDER.forEach(cat => {
    const meta = CATEGORY_META[cat];
    const section = document.createElement('div');
    section.className = 'detail-section';
    const title = document.createElement('div');
    title.className = 'detail-section-title';
    title.textContent = meta.label;
    section.appendChild(title);

    const list = document.createElement('div');
    list.className = 'detail-tag-list';
    const catValues = member.tags[cat] || [];
    catValues.forEach((value, index) => {
      const tag = document.createElement('span');
      tag.className = 'detail-tag';
      tag.style.background = meta.bg;
      tag.style.color = meta.text;
      const label = document.createElement('span');
      label.textContent = value;
      const removeBtn = document.createElement('button');
      removeBtn.textContent = '✕';
      removeBtn.style.color = meta.text;
      removeBtn.title = 'タグを削除';
      removeBtn.addEventListener('click', () => deleteTag(member.nickname, cat, value));
      if (catValues.length > 1) {
        const moveLeftBtn = document.createElement('button');
        moveLeftBtn.textContent = '←';
        moveLeftBtn.style.color = meta.text;
        moveLeftBtn.title = '一つ前に移動';
        moveLeftBtn.disabled = index === 0;
        moveLeftBtn.addEventListener('click', () => moveTag(member.nickname, cat, index, -1));
        tag.appendChild(moveLeftBtn);
      }
      tag.appendChild(label);
      if (catValues.length > 1) {
        const moveRightBtn = document.createElement('button');
        moveRightBtn.textContent = '→';
        moveRightBtn.style.color = meta.text;
        moveRightBtn.title = '一つ後ろに移動';
        moveRightBtn.disabled = index === catValues.length - 1;
        moveRightBtn.addEventListener('click', () => moveTag(member.nickname, cat, index, 1));
        tag.appendChild(moveRightBtn);
      }
      tag.appendChild(removeBtn);
      list.appendChild(tag);
    });
    section.appendChild(list);

    const form = document.createElement('div');
    form.className = 'add-tag-form';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = `${meta.label}を追加`;
    input.setAttribute('autocomplete', 'off');
    const datalistId = `tag-options-${cat}`;
    const datalist = document.createElement('datalist');
    datalist.id = datalistId;
    const suggestionCategories = [cat, TAG_SUGGESTION_SOURCE_CATEGORY[cat]].filter(Boolean);
    const suggestions = new Set();
    suggestionCategories.forEach(c => tagOptionsForCategory(c).forEach(v => suggestions.add(v)));
    [...suggestions].sort((a, b) => a.localeCompare(b, 'ja')).forEach(value => {
      const option = document.createElement('option');
      option.value = value;
      datalist.appendChild(option);
    });
    input.setAttribute('list', datalistId);
    const addBtn = document.createElement('button');
    addBtn.textContent = '＋追加';
    addBtn.addEventListener('click', () => addTag(member.nickname, cat, input.value));
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addTag(member.nickname, cat, input.value); });
    form.appendChild(input);
    form.appendChild(datalist);
    form.appendChild(addBtn);
    section.appendChild(form);

    profilePane.appendChild(section);
  });

  profilePane.appendChild(buildLocationSection(member));
  if (!readonly) profilePane.appendChild(buildJoinedMonthSection(member));
  profilePane.appendChild(buildIntroSection(member));
  if (!readonly) panes.matching.appendChild(buildConsultationThemeSection(member, panes.tabButtons.matching));
  panes.matching.appendChild(buildMatchingSection(member));

  function buildLinkItem(label, url) {
    const wrap = document.createElement('span');
    wrap.className = 'detail-link-wrap';
    const link = document.createElement('a');
    link.className = 'detail-link';
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = `${linkIcon(label)} ${label}`;
    const removeBtn = document.createElement('button');
    removeBtn.className = 'detail-link-remove';
    removeBtn.textContent = '✕';
    removeBtn.title = 'リンクを削除';
    removeBtn.addEventListener('click', () => deleteLink(member.nickname, url));
    wrap.appendChild(link);
    wrap.appendChild(removeBtn);
    return wrap;
  }

  const allLinks = member.links || [];
  const memoLinks = allLinks.filter(({ label, url }) => linkType(label, url) === 'memo');
  const snsLinks = allLinks.filter(({ label, url }) => linkType(label, url) !== 'memo');

  {
    const section = document.createElement('div');
    section.className = 'detail-section';
    const title = document.createElement('div');
    title.className = 'detail-section-title';
    title.textContent = 'リンク（note・YouTube・ブログなど）';
    if (readonly) section.appendChild(title);

    const list = document.createElement('div');
    list.className = 'detail-link-list';
    snsLinks.forEach(({ label, url }) => list.appendChild(buildLinkItem(label, url)));
    section.appendChild(list);

    const form = document.createElement('div');
    form.className = 'add-tag-form';
    const labelInput = document.createElement('input');
    labelInput.type = 'text';
    labelInput.placeholder = 'ラベル（例: note）';
    labelInput.style.width = '110px';
    labelInput.setAttribute('autocomplete', 'off');
    const urlInput = document.createElement('input');
    urlInput.type = 'text';
    urlInput.placeholder = 'URL';
    urlInput.style.flex = '1';
    urlInput.style.minWidth = '160px';
    urlInput.setAttribute('autocomplete', 'off');
    const addBtn = document.createElement('button');
    addBtn.textContent = '＋追加';
    addBtn.addEventListener('click', () => addLink(member.nickname, labelInput, urlInput));
    urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') addLink(member.nickname, labelInput, urlInput); });
    form.appendChild(labelInput);
    form.appendChild(urlInput);
    form.appendChild(addBtn);
    section.appendChild(form);

    profilePane.appendChild(readonly
      ? section
      : buildDetailFold('リンク（note・YouTube・ブログなど）', snsLinks.length ? `${snsLinks.length}件` : '未登録', section));
  }

  {
    const section = document.createElement('div');
    section.className = 'detail-section';
    const title = document.createElement('div');
    title.className = 'detail-section-title';
    title.textContent = '個人メモ（非公開リンク）';
    if (readonly) section.appendChild(title);

    const list = document.createElement('div');
    list.className = 'detail-link-list';
    memoLinks.forEach(({ label, url }) => list.appendChild(buildLinkItem(label, url)));
    section.appendChild(list);

    const form = document.createElement('div');
    form.className = 'add-tag-form';
    const memoLabelInput = document.createElement('input');
    memoLabelInput.type = 'hidden';
    memoLabelInput.value = '個人メモ';
    const urlInput = document.createElement('input');
    urlInput.type = 'text';
    urlInput.placeholder = '例: Notion, Google DocsなどのURL';
    urlInput.style.flex = '1';
    urlInput.style.minWidth = '160px';
    urlInput.setAttribute('autocomplete', 'off');
    const addBtn = document.createElement('button');
    addBtn.textContent = '＋追加';
    addBtn.addEventListener('click', () => addLink(member.nickname, memoLabelInput, urlInput));
    urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') addLink(member.nickname, memoLabelInput, urlInput); });
    form.appendChild(urlInput);
    form.appendChild(addBtn);
    section.appendChild(form);

    const hint = document.createElement('div');
    hint.style.cssText = 'font-size: 11px; color: #9ca3af; margin-top: 6px;';
    hint.textContent = '自分だけが閲覧できるメモページへのリンクを貼れます（例: Notion、Google Docs、Google Keep、Evernoteなど、閲覧権限を限定共有できるツール）。アクセス権はリンク先のツール側の共有設定に依存するため、限定共有設定を必ずご確認ください。';
    section.appendChild(hint);

    profilePane.appendChild(readonly
      ? section
      : buildDetailFold('個人メモ（非公開リンク）', memoLinks.length ? `${memoLinks.length}件` : '未登録', section));
  }

  if (!readonly) {
    profilePane.appendChild(buildPublicSettingsSection(member, {
      open: publicSettingsOpen,
      externalIntroPreviewOpen,
    }));
  }

  const postsSection = buildCommunityPostsSection(member);
  if (postsSection.childElementCount) {
    panes.posts.appendChild(postsSection);
  } else {
    const empty = document.createElement('div');
    empty.className = 'intro-placeholder';
    empty.textContent = 'まだ投稿はありません。';
    panes.posts.appendChild(empty);
  }
}

let detailTab = 'profile';
let detailTabNickname = null;
// 折りたたみの開閉は、保存後の再描画でも保つ(リンクを追加したら閉じてしまわないように)。
const detailOpenFolds = new Set();

const DETAIL_TABS = [
  { key: 'profile', label: 'プロフィール' },
  { key: 'matching', label: 'ゆるマッチング' },
  { key: 'posts', label: '投稿' },
];

// メンバー詳細のタブ見出しと、タブごとの中身の入れ物を作る。戻り値は { profile, matching, posts }。
function buildDetailTabs(content) {
  const tablist = document.createElement('div');
  tablist.className = 'detail-tabs';
  tablist.setAttribute('role', 'tablist');
  tablist.setAttribute('aria-label', 'メンバー詳細');
  content.appendChild(tablist);

  const panes = {};
  const buttons = {};
  const select = key => {
    detailTab = key;
    DETAIL_TABS.forEach(({ key: k }) => {
      const active = k === key;
      buttons[k].classList.toggle('active', active);
      buttons[k].setAttribute('aria-selected', String(active));
      buttons[k].tabIndex = active ? 0 : -1;
      panes[k].hidden = !active;
    });
  };
  DETAIL_TABS.forEach(({ key, label }) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'detail-tab';
    button.id = `detail-tab-${key}`;
    button.setAttribute('role', 'tab');
    button.setAttribute('aria-controls', `detail-pane-${key}`);
    const labelEl = document.createElement('span');
    labelEl.textContent = label;
    button.appendChild(labelEl);
    button.addEventListener('click', () => select(key));
    button.addEventListener('keydown', e => {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      const index = DETAIL_TABS.findIndex(t => t.key === key);
      const next = DETAIL_TABS[(index + (e.key === 'ArrowRight' ? 1 : DETAIL_TABS.length - 1)) % DETAIL_TABS.length];
      select(next.key);
      buttons[next.key].focus();
    });
    tablist.appendChild(button);
    buttons[key] = button;

    const pane = document.createElement('div');
    pane.className = 'detail-pane';
    pane.id = `detail-pane-${key}`;
    pane.setAttribute('role', 'tabpanel');
    pane.setAttribute('aria-labelledby', button.id);
    content.appendChild(pane);
    panes[key] = pane;
  });
  select(DETAIL_TABS.some(t => t.key === detailTab) ? detailTab : 'profile');
  panes.tabButtons = buttons;
  return panes;
}

// ================================================================
// 相談テーママッチング(issue #322)
// 本人が書いた相談テーマを、ふぁいにゃが匿名で #ゆるマッチング に代行投稿する。投稿と取り下げは
// Edge Function(supabase/functions/consultation-request)、手上げの集計とグループ作成は
// scripts/process_consultation_requests.py。consultation_requests は本人の行しか読めない。
// ================================================================
const CONSULTATION_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/consultation-request`;
const CONSULTATION_BODY_MIN = 5;
const CONSULTATION_BODY_MAX = 500;
const CONSULTATION_TARGET_HANDS = 3;
// 入力中の文章と画面の段階は、保存後の再描画でも消えないようにメンバー単位で持つ。
const consultationDrafts = new Map();

function consultationDraft(nickname) {
  if (!consultationDrafts.has(nickname)) consultationDrafts.set(nickname, { step: 'closed', text: '' });
  return consultationDrafts.get(nickname);
}

async function fetchMyConsultationRequests(nickname) {
  const select = 'id,body,status,posted_at,deadline_at,responder_count,closed_at';
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/consultation_requests?select=${select}&member_nickname=eq.${encodeURIComponent(nickname)}&order=posted_at.desc`,
    { headers: authHeaders() },
  );
  if (!res.ok) throw new Error(`consultation_requests fetch failed: HTTP ${res.status}`);
  return res.json();
}

async function callConsultationFunction(payload) {
  const res = await fetch(CONSULTATION_FUNCTION_URL, {
    method: 'POST',
    headers: { ...authHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  return data && data.status ? data : { status: 'error' };
}

function consultationErrorMessage(status) {
  return {
    invalid_body: `${CONSULTATION_BODY_MIN}〜${CONSULTATION_BODY_MAX}文字で書いてください。`,
    not_opted_in: 'ゆるマッチングをONにすると募集できます。',
    no_availability: '空いている時間帯を1つ以上登録すると募集できます。',
    already_closed: 'この募集はすでに終了しています。',
    not_found: '募集が見つかりませんでした。',
  }[status] || '送れませんでした。時間をおいてもう一度試してください。';
}

function formatConsultationDate(iso) {
  const d = new Date(iso);
  const weekday = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
  return `${d.getMonth() + 1}/${d.getDate()}(${weekday})`;
}

function consultationEl(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text != null) el.textContent = text;
  return el;
}

function buildConsultationPreview(text) {
  const preview = consultationEl('div', 'consult-preview');
  preview.appendChild(consultationEl('div', 'consult-preview-avatar', 'ふ'));
  const bubble = consultationEl('div');
  bubble.style.cssText = 'display: flex; flex-direction: column; gap: 4px; min-width: 0;';
  const name = consultationEl('div');
  name.append(consultationEl('span', 'consult-preview-name', 'ふぁいにゃ'), consultationEl('span', 'consult-preview-bot', 'BOT'));
  const deadline = new Date(Date.now() + 7 * 24 * 3600 * 1000);
  bubble.append(
    name,
    consultationEl('div', null, '🐾 ふぁいにゃです。こんな相談テーマで話したい人がいます（投稿した人は匿名です）。'),
    consultationEl('div', 'consult-preview-quote', text),
    consultationEl('div', null, `話せる方は ✋ でリアクションしてください。時間帯が合う方が集まったら、ゆるマッチングとしてご案内します（締め切り: ${formatConsultationDate(deadline.toISOString())}）。`),
  );
  preview.appendChild(bubble);
  return preview;
}

// ゆるマッチングタブの先頭に置く相談テーマ欄(本人のプロフィールのみ)。
function buildConsultationThemeSection(member, matchingTabButton) {
  const wrap = document.createElement('div');
  wrap.className = 'consult-section';
  const draft = consultationDraft(member.nickname);
  const rerender = () => openMemberDetail(member.nickname, { updateHash: false, scrollToTop: false, tab: 'matching' });
  let requests = [];
  let loadFailed = false;

  function render() {
    wrap.innerHTML = '';
    const recruiting = requests.filter(r => r.status === 'recruiting');
    const closed = requests.filter(r => r.status !== 'recruiting');

    if (matchingTabButton && !matchingTabButton.querySelector('.detail-tab-badge') && recruiting.length) {
      matchingTabButton.appendChild(consultationEl('span', 'detail-tab-badge', '募集中'));
    }

    recruiting.forEach(request => wrap.appendChild(buildRecruitingCard(request)));

    const optedIn = Boolean(member.matching && member.matching.opted_in);
    const hasSlots = Boolean(member.availability && member.availability.length);
    if (!optedIn || !hasSlots) {
      const card = consultationEl('div', 'consult-card consult-entry locked');
      const text = consultationEl('div', 'consult-entry-text');
      text.append(
        consultationEl('div', 'consult-entry-title', '相談テーマで話し相手を募集'),
        consultationEl('div', 'consult-entry-sub', optedIn
          ? '時間帯を合わせるため、下の「空いている時間帯」を1つ以上登録すると使えます。'
          : '時間帯を合わせるため、ゆるマッチングをONにすると使えます。'),
      );
      card.appendChild(text);
      if (!optedIn) {
        const on = consultationEl('button', 'consult-primary-btn blue', 'ONにする');
        on.type = 'button';
        on.addEventListener('click', async () => {
          on.disabled = true;
          await upsertMatchingSettings(member.nickname, { opted_in: true });
          await refreshDirectory();
          rerender();
        });
        card.appendChild(on);
      }
      wrap.appendChild(card);
    } else if (draft.step === 'edit') {
      wrap.appendChild(buildEditCard());
    } else if (draft.step === 'confirm') {
      wrap.appendChild(buildConfirmCard());
    } else {
      const card = consultationEl('div', 'consult-card consult-entry');
      const text = consultationEl('div', 'consult-entry-text');
      text.append(
        consultationEl('div', 'consult-entry-title', recruiting.length ? '別の相談テーマも募集する' : '相談テーマで話し相手を募集'),
        consultationEl('div', 'consult-entry-sub', 'ふぁいにゃが匿名で代わりに #ゆるマッチング で募集します'),
      );
      const start = consultationEl('button', 'consult-primary-btn', '書いてみる');
      start.type = 'button';
      start.addEventListener('click', () => { draft.step = 'edit'; render(); });
      card.append(text, start);
      wrap.appendChild(card);
    }

    if (loadFailed) wrap.appendChild(consultationEl('div', 'consult-error', 'これまでの相談テーマを読み込めませんでした。'));

    if (closed.length) {
      const list = consultationEl('div');
      closed.forEach(request => {
        const item = consultationEl('div', 'consult-history-item');
        const label = {
          matched: ['成立', 'matched'],
          expired: ['締め切りで終了', 'closed'],
          withdrawn: ['取り下げ', 'closed'],
        }[request.status] || [request.status, 'closed'];
        item.append(
          consultationEl('span', 'consult-history-body', request.body.split('\n')[0]),
          consultationEl('span', `consult-badge ${label[1]}`, `${label[0]} ${formatConsultationDate(request.closed_at || request.posted_at)}`),
        );
        list.appendChild(item);
      });
      wrap.appendChild(buildDetailFold('これまでの相談テーマ', `${closed.length}件`, list));
    }
  }

  function buildEditCard() {
    const card = consultationEl('div', 'consult-card');
    const label = consultationEl('label', null, '話したい相談テーマ');
    label.htmlFor = 'consult-textarea';
    const textarea = document.createElement('textarea');
    textarea.id = 'consult-textarea';
    textarea.rows = 4;
    textarea.maxLength = CONSULTATION_BODY_MAX;
    textarea.placeholder = '例: 親の介護と仕事の両立について、経験のある方と話してみたいです';
    textarea.value = draft.text;
    const count = consultationEl('div', 'consult-count');
    const updateCount = () => {
      const length = [...textarea.value.trim()].length;
      count.textContent = `${length} / ${CONSULTATION_BODY_MAX}`;
      count.classList.toggle('over', length > CONSULTATION_BODY_MAX);
      next.disabled = length < CONSULTATION_BODY_MIN || length > CONSULTATION_BODY_MAX;
    };
    textarea.addEventListener('input', () => { draft.text = textarea.value; updateCount(); });
    const cancel = consultationEl('button', 'consult-secondary-btn', 'やめる');
    cancel.type = 'button';
    cancel.addEventListener('click', () => { draft.step = 'closed'; draft.text = ''; render(); });
    const next = consultationEl('button', 'consult-primary-btn blue', '投稿される内容を確認');
    next.type = 'button';
    next.addEventListener('click', () => { draft.step = 'confirm'; render(); });
    const actions = consultationEl('div', 'consult-actions');
    actions.append(cancel, next);
    card.append(
      label,
      textarea,
      count,
      consultationEl('div', 'consult-warning', 'この文章は、ふぁいにゃがそのまま #ゆるマッチング に投稿します。名前や、あなただと分かる情報は書かないでください。'),
      consultationEl('div', 'consult-note', '下の「空いている時間帯」と合う人が先着で手を挙げ、あなたを含めて4人になったら成立します（3日たって3人なら3人で成立）。1週間で締め切ります。成立したら、いつものゆるマッチングと同じようにメンバーが紹介されます。'),
      actions,
    );
    updateCount();
    requestAnimationFrame(() => textarea.focus());
    return card;
  }

  function buildConfirmCard() {
    const card = consultationEl('div', 'consult-card');
    const error = consultationEl('div', 'consult-error');
    const post = consultationEl('button', 'consult-primary-btn', 'ふぁいにゃに代行投稿してもらう');
    post.type = 'button';
    post.style.minHeight = '48px';
    post.addEventListener('click', async () => {
      post.disabled = true;
      back.disabled = true;
      post.textContent = '投稿しています…';
      const result = await callConsultationFunction({ action: 'create', body: draft.text });
      if (result.status === 'created') {
        draft.step = 'closed';
        draft.text = '';
        rerender();
        return;
      }
      error.textContent = consultationErrorMessage(result.status);
      post.disabled = false;
      back.disabled = false;
      post.textContent = 'ふぁいにゃに代行投稿してもらう';
    });
    const back = consultationEl('button', 'consult-secondary-btn', '戻って直す');
    back.type = 'button';
    back.addEventListener('click', () => { draft.step = 'edit'; render(); });
    card.append(
      consultationEl('div', 'consult-entry-title', 'この内容で #ゆるマッチング に投稿されます'),
      buildConsultationPreview(draft.text.trim()),
      post,
      consultationEl('div', 'consult-note', '押すとすぐに投稿されます。あなたの名前は、話し相手が集まってマッチングが成立するまで出ません。'),
      back,
      error,
    );
    return card;
  }

  function buildRecruitingCard(request) {
    const card = consultationEl('div', 'consult-card');
    const row = consultationEl('div', 'consult-status-row');
    row.append(
      consultationEl('span', 'consult-badge', '相談テーマ募集中'),
      consultationEl('span', 'consult-note', `締め切り ${formatConsultationDate(request.deadline_at)}`),
    );
    const count = Math.min(request.responder_count || 0, CONSULTATION_TARGET_HANDS);
    const progress = consultationEl('div', 'consult-progress');
    const bar = consultationEl('div');
    bar.style.width = `${Math.round((count / CONSULTATION_TARGET_HANDS) * 100)}%`;
    progress.appendChild(bar);
    const footer = consultationEl('div', 'consult-status-row');
    const link = consultationEl('a', null, '#ゆるマッチング で見る');
    link.href = MATCHING_DISCORD_CHANNEL_URL;
    link.target = '_blank';
    link.rel = 'noopener';
    link.style.fontSize = '12px';
    const withdraw = consultationEl('button', 'consult-secondary-btn', '取り下げる');
    withdraw.type = 'button';
    withdraw.style.minHeight = '36px';
    const error = consultationEl('div', 'consult-error');
    let armed = false;
    withdraw.addEventListener('click', async () => {
      if (!armed) {
        armed = true;
        withdraw.textContent = '本当に取り下げる';
        return;
      }
      withdraw.disabled = true;
      const result = await callConsultationFunction({ action: 'withdraw', id: request.id });
      if (result.status === 'withdrawn' || result.status === 'already_closed') {
        rerender();
        return;
      }
      error.textContent = consultationErrorMessage(result.status);
      withdraw.disabled = false;
    });
    footer.append(link, withdraw);
    card.append(
      row,
      consultationEl('div', 'consult-body', request.body),
      consultationEl('div', 'consult-note', `手を挙げた人（時間帯が合う人のみ） ${count} / ${CONSULTATION_TARGET_HANDS}人`),
      progress,
      footer,
      error,
    );
    return card;
  }

  render();
  fetchMyConsultationRequests(member.nickname)
    .then(rows => { requests = rows; })
    .catch(err => { console.warn(err); loadFailed = true; })
    .then(() => { if (wrap.isConnected || !wrap.parentNode) render(); });
  return wrap;
}

// 自分のプロフィールで、たまにしか触らない欄(リンク・個人メモ)を折りたたむ。
function buildDetailFold(titleText, summaryText, body) {
  const fold = document.createElement('details');
  fold.className = 'public-settings detail-fold';
  fold.open = detailOpenFolds.has(titleText);
  fold.addEventListener('toggle', () => {
    if (fold.open) detailOpenFolds.add(titleText);
    else detailOpenFolds.delete(titleText);
  });
  const summary = document.createElement('summary');
  const title = document.createElement('div');
  title.className = 'public-settings-title';
  title.textContent = titleText;
  const summaryEl = document.createElement('div');
  summaryEl.className = 'public-settings-summary';
  summaryEl.textContent = summaryText;
  const chevron = document.createElement('span');
  chevron.className = 'public-settings-chevron';
  chevron.textContent = '⌄';
  summary.append(title, summaryEl, chevron);
  const inner = document.createElement('div');
  inner.className = 'public-settings-body';
  inner.appendChild(body);
  fold.append(summary, inner);
  return fold;
}


// ================================================================
// イベント開催記録
// community_events テーブルから読み込み、開催日時で「これから開催」と
// 「開催済み」に分ける。種別はナビゲーションではなく小さなタグとして出す。
// ================================================================

let communityEvents = [];
let communityEventsUnavailable = false;
let bookshelfBooks = [];
let activeEventsSection = 'calendar';
const EVENT_PAGE_SIZE = 10;
const eventPages = { calendar: 1, upcoming: 1, past: 1 };
const eventCalendarMonths = { calendar: null, upcoming: null, past: null };
let pendingEventScrollId = null;

const EVENT_FORMAT_LABELS = {
  online: 'オンライン',
  offline: 'オフ会',
  hybrid: 'ハイブリッド',
  unknown: '形式未定',
};

function formatEventDateParts(value) {
  if (!value) return { day: '', weekday: '', time: '' };
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return { day: '', weekday: '', time: '' };
  const day = new Intl.DateTimeFormat('ja-JP', {
    month: 'numeric',
    day: 'numeric',
  }).format(date);
  const weekday = new Intl.DateTimeFormat('ja-JP', {
    weekday: 'short',
  }).format(date);
  const time = new Intl.DateTimeFormat('ja-JP', {
    hour: '2-digit',
    minute: '2-digit',
  }).format(date);
  return { day, weekday, time };
}

function eventTags(event) {
  const tags = Array.isArray(event.tags) ? event.tags.filter(Boolean) : [];
  const formatLabel = EVENT_FORMAT_LABELS[event.format];
  if (formatLabel && !tags.includes(formatLabel)) return [formatLabel, ...tags];
  return tags;
}

function hasEventTag(event, tag) {
  return Array.isArray(event.tags) && event.tags.includes(tag);
}

function isTentativeDateEvent(event) {
  return hasEventTag(event, '日程調整中');
}

function isTentativeTimeEvent(event) {
  return hasEventTag(event, '時間調整中');
}

function isUpcomingEvent(event, now) {
  if (event.cancelled_at) return false;
  const end = event.ends_at ? new Date(event.ends_at) : null;
  const start = new Date(event.starts_at);
  const boundary = end && !Number.isNaN(end.getTime()) ? end : start;
  return !Number.isNaN(boundary.getTime()) && boundary >= now;
}

function isScheduledEventRow(event) {
  return String(event.discord_message_id || '').startsWith('scheduled_event:');
}

function normalizeEventTitle(value) {
  return String(value || '')
    .replace(/[!！\s　]/g, '')
    .replace(/第[0-9０-９]+弾/g, '')
    .trim();
}

function isLikelyDuplicateEvent(a, b) {
  if (!isScheduledEventRow(a) && !isScheduledEventRow(b)) return false;
  if (a.format !== b.format) return false;
  const aStart = new Date(a.starts_at);
  const bStart = new Date(b.starts_at);
  if (Number.isNaN(aStart.getTime()) || Number.isNaN(bStart.getTime())) return false;
  if (Math.abs(aStart.getTime() - bStart.getTime()) > 60 * 1000) return false;
  const aTitle = normalizeEventTitle(a.title);
  const bTitle = normalizeEventTitle(b.title);
  return Boolean(aTitle && bTitle && (aTitle.includes(bTitle) || bTitle.includes(aTitle)));
}

function mergeDuplicateEvent(preferred, duplicate) {
  const preferredTitle = String(preferred.title || '');
  const duplicateTitle = String(duplicate.title || '');
  const title = isScheduledEventRow(duplicate)
    && normalizeEventTitle(duplicateTitle).includes(normalizeEventTitle(preferredTitle))
    && duplicateTitle.length > preferredTitle.length
      ? duplicateTitle.replace(/[!！]+$/g, '')
      : preferred.title;
  return {
    ...preferred,
    title,
    participant_count: preferred.participant_count ?? duplicate.participant_count,
    participation_note: preferred.participation_note || duplicate.participation_note,
    summary: preferred.summary || duplicate.summary,
    discord_channel_name: preferred.discord_channel_name || duplicate.discord_channel_name,
  };
}

function dedupeEvents(events) {
  return events.reduce((deduped, event) => {
    const duplicateIndex = deduped.findIndex(existing => isLikelyDuplicateEvent(existing, event));
    if (duplicateIndex < 0) return [...deduped, event];
    const existing = deduped[duplicateIndex];
    const preferred = isScheduledEventRow(existing) && !isScheduledEventRow(event) ? event : existing;
    const duplicate = preferred === existing ? event : existing;
    const next = deduped.slice();
    next[duplicateIndex] = mergeDuplicateEvent(preferred, duplicate);
    return next;
  }, []);
}

function formatGoogleCalendarDate(value) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return null;
  return date.toISOString().replace(/[-:]|\.\d{3}/g, '');
}

function googleCalendarUrl(event) {
  if (isTentativeDateEvent(event) || isTentativeTimeEvent(event)) return null;
  const start = formatGoogleCalendarDate(event.starts_at);
  if (!start) return null;
  const startDate = new Date(event.starts_at);
  const endDate = event.ends_at ? new Date(event.ends_at) : new Date(startDate.getTime() + 60 * 60 * 1000);
  const end = Number.isNaN(endDate.getTime()) ? null : formatGoogleCalendarDate(endDate.toISOString());
  if (!end) return null;
  const details = [event.summary, event.participation_note, event.discord_permalink]
    .filter(Boolean)
    .join('\n\n');
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: event.title,
    dates: `${start}/${end}`,
  });
  if (details) params.set('details', details);
  const locationText = [event.prefecture, event.location_label].filter(Boolean).join(' / ');
  if (locationText) params.set('location', locationText);
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

function eventDateDisplayParts(event) {
  if (!isTentativeDateEvent(event)) {
    const parts = formatEventDateParts(event.starts_at);
    if (isTentativeTimeEvent(event)) return { ...parts, time: '時間調整中' };
    return parts;
  }
  const date = new Date(event.starts_at);
  const month = Number.isNaN(date.getTime()) ? '候補' : `${date.getMonth() + 1}月`;
  return { day: month, weekday: '候補', time: '日程調整中' };
}

function appendEventText(card, label, text) {
  if (!text) return;
  const row = document.createElement('div');
  row.className = 'event-text';
  const labelEl = document.createElement('span');
  labelEl.className = 'event-note-label';
  labelEl.textContent = `${label}: `;
  row.appendChild(labelEl);
  row.appendChild(document.createTextNode(text));
  card.appendChild(row);
}

function eventDomId(event) {
  return `event-${String(event.discord_message_id || event.title || '').replace(/[^a-zA-Z0-9_-]/g, '-')}`;
}

function buildEventCard(event, mode) {
  const card = document.createElement('div');
  card.className = 'event-card' + (event.cancelled_at ? ' cancelled' : '');
  card.id = eventDomId(event);

  const main = document.createElement('div');
  main.className = 'event-card-main';

  const dateSide = document.createElement('div');
  dateSide.className = 'event-date-side';
  const dateParts = eventDateDisplayParts(event);
  const dateBlock = document.createElement('div');
  dateBlock.className = 'event-date-block' + ((isTentativeDateEvent(event) || isTentativeTimeEvent(event)) ? ' tentative' : '');
  const day = document.createElement('div');
  day.className = 'event-date-day';
  day.textContent = dateParts.day;
  const weekday = document.createElement('div');
  weekday.className = 'event-date-weekday';
  weekday.textContent = `(${dateParts.weekday})`;
  const time = document.createElement('div');
  time.className = 'event-date-time';
  time.textContent = dateParts.time;
  dateBlock.appendChild(day);
  dateBlock.appendChild(weekday);
  dateBlock.appendChild(time);
  dateSide.appendChild(dateBlock);
  const calendarUrl = googleCalendarUrl(event);
  if (calendarUrl) {
    const calendarLink = document.createElement('a');
    calendarLink.className = 'event-calendar-link';
    calendarLink.href = calendarUrl;
    calendarLink.target = '_blank';
    calendarLink.rel = 'noopener';
    calendarLink.textContent = 'Googleカレンダーに追加';
    dateSide.appendChild(calendarLink);
  }
  main.appendChild(dateSide);

  const content = document.createElement('div');
  content.className = 'event-content';

  const title = document.createElement('div');
  title.className = 'event-title';
  title.textContent = event.title;
  content.appendChild(title);

  const tags = document.createElement('div');
  tags.className = 'event-tags';
  if (event.cancelled_at) {
    const cancelled = document.createElement('span');
    cancelled.className = 'event-tag status';
    cancelled.textContent = '中止';
    tags.appendChild(cancelled);
  }
  eventTags(event).forEach(value => {
    const tag = document.createElement('span');
    tag.className = 'event-tag';
    tag.textContent = value;
    tags.appendChild(tag);
  });
  if (tags.children.length) content.appendChild(tags);

  const meta = document.createElement('div');
  meta.className = 'event-meta';
  const metaValues = [];
  const locationText = [event.prefecture, event.location_label].filter(Boolean).join(' / ');
  if (locationText) metaValues.push(locationText);
  if (event.participant_count != null) metaValues.push(`参加 ${event.participant_count}名`);
  metaValues.forEach(value => {
    const item = document.createElement('span');
    item.textContent = value;
    meta.appendChild(item);
  });
  if (meta.children.length) content.appendChild(meta);

  if (mode === 'upcoming') {
    appendEventText(content, '参加方法', event.participation_note);
    appendEventText(content, '概要', event.summary);
  } else {
    appendEventText(content, '概要', event.summary);
    appendEventText(content, 'よかった点', event.highlights);
    appendEventText(content, '次回メモ', event.learnings);
  }

  const actions = document.createElement('div');
  actions.className = 'event-actions';
  if (event.discord_permalink) {
    const link = document.createElement('a');
    link.className = 'event-primary-link';
    link.href = event.discord_permalink;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = 'Discordで見る →';
    actions.appendChild(link);
  }
  if (actions.children.length) content.appendChild(actions);

  main.appendChild(content);
  card.appendChild(main);
  return card;
}

function monthStart(date) {
  return new Date(date.getFullYear(), date.getMonth(), 1);
}

function addMonths(date, delta) {
  return new Date(date.getFullYear(), date.getMonth() + delta, 1);
}

function monthKey(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
}

function eventDateKey(event) {
  const date = new Date(event.starts_at);
  if (Number.isNaN(date.getTime())) return '';
  return [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, '0'),
    String(date.getDate()).padStart(2, '0'),
  ].join('-');
}

function eventTimeLabel(event) {
  if (isTentativeDateEvent(event) || isTentativeTimeEvent(event)) return '';
  const date = new Date(event.starts_at);
  if (Number.isNaN(date.getTime())) return '';
  return new Intl.DateTimeFormat('ja-JP', {
    hour: '2-digit',
    minute: '2-digit',
  }).format(date);
}

function defaultCalendarMonth(events, mode) {
  if (events.length) {
    const event = mode === 'past' ? events[0] : events.find(item => !isTentativeDateEvent(item)) || events[0];
    const date = new Date(event.starts_at);
    if (!Number.isNaN(date.getTime())) return monthStart(date);
  }
  return monthStart(new Date());
}

function renderEventCalendar(events, mode) {
  if (!events.length) return null;
  if (!eventCalendarMonths[mode]) eventCalendarMonths[mode] = defaultCalendarMonth(events, mode);

  const activeMonth = eventCalendarMonths[mode];
  const monthEvents = events.filter(event => {
    const date = new Date(event.starts_at);
    return !Number.isNaN(date.getTime()) && monthKey(date) === monthKey(activeMonth);
  });
  const eventsByDate = monthEvents.reduce((acc, event) => {
    const key = eventDateKey(event);
    if (!key) return acc;
    if (!acc[key]) acc[key] = [];
    acc[key].push(event);
    return acc;
  }, {});
  Object.values(eventsByDate).forEach(dayEvents => {
    dayEvents.sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
  });

  const shell = document.createElement('div');
  shell.className = 'events-calendar';

  const toolbar = document.createElement('div');
  toolbar.className = 'events-calendar-toolbar';

  const title = document.createElement('div');
  title.className = 'events-calendar-title';
  title.textContent = new Intl.DateTimeFormat('ja-JP', { year: 'numeric', month: 'long' }).format(activeMonth);
  toolbar.appendChild(title);

  const actions = document.createElement('div');
  actions.className = 'events-calendar-actions';
  [
    { label: '‹', delta: -1 },
    { label: '今日', delta: 0 },
    { label: '›', delta: 1 },
  ].forEach(item => {
    const button = document.createElement('button');
    button.className = 'events-calendar-button';
    button.type = 'button';
    button.textContent = item.label;
    button.addEventListener('click', () => {
      eventCalendarMonths[mode] = item.delta === 0 ? monthStart(new Date()) : addMonths(activeMonth, item.delta);
      renderEventsView();
    });
    actions.appendChild(button);
  });
  toolbar.appendChild(actions);
  shell.appendChild(toolbar);

  const grid = document.createElement('div');
  grid.className = 'events-calendar-grid';
  ['日', '月', '火', '水', '木', '金', '土'].forEach(label => {
    const weekday = document.createElement('div');
    weekday.className = 'events-calendar-weekday';
    weekday.textContent = label;
    grid.appendChild(weekday);
  });

  const firstCell = new Date(activeMonth);
  firstCell.setDate(firstCell.getDate() - firstCell.getDay());
  const todayKey = eventDateKey({ starts_at: new Date().toISOString() });
  for (let i = 0; i < 42; i += 1) {
    const date = new Date(firstCell);
    date.setDate(firstCell.getDate() + i);
    const key = [
      date.getFullYear(),
      String(date.getMonth() + 1).padStart(2, '0'),
      String(date.getDate()).padStart(2, '0'),
    ].join('-');
    const day = document.createElement('div');
    day.className = 'events-calendar-day' + (date.getMonth() === activeMonth.getMonth() ? '' : ' outside');
    const dateLabel = document.createElement('div');
    dateLabel.className = 'events-calendar-date' + (key === todayKey ? ' today' : '');
    dateLabel.textContent = date.getDate();
    day.appendChild(dateLabel);

    const dayEvents = eventsByDate[key] || [];
    dayEvents.slice(0, 3).forEach(event => {
      const eventButton = document.createElement('button');
      eventButton.className = 'events-calendar-event' + (event.format === 'offline' ? ' offline' : '');
      eventButton.type = 'button';
      const timeLabel = eventTimeLabel(event);
      eventButton.textContent = timeLabel ? `${timeLabel} ${event.title}` : event.title;
      eventButton.title = event.title;
      eventButton.addEventListener('click', () => {
        const pageEvents = mode === 'calendar' ? monthEvents : events;
        const index = pageEvents.findIndex(item => item.discord_message_id === event.discord_message_id);
        if (index >= 0) eventPages[mode] = Math.floor(index / EVENT_PAGE_SIZE) + 1;
        pendingEventScrollId = eventDomId(event);
        renderEventsView();
      });
      day.appendChild(eventButton);
    });
    if (dayEvents.length > 3) {
      const more = document.createElement('div');
      more.className = 'events-calendar-more';
      more.textContent = `他 ${dayEvents.length - 3}件`;
      day.appendChild(more);
    }
    grid.appendChild(day);
  }

  shell.appendChild(grid);
  return shell;
}

function buildPagination({ page, totalItems, pageSize, onPageChange }) {
  const totalPages = Math.max(1, Math.ceil(totalItems / pageSize));
  if (totalPages <= 1) return null;

  const nav = document.createElement('div');
  nav.className = 'pagination';

  const prev = document.createElement('button');
  prev.className = 'pagination-button';
  prev.type = 'button';
  prev.textContent = '前へ';
  prev.disabled = page <= 1;
  prev.addEventListener('click', () => onPageChange(page - 1));
  nav.appendChild(prev);

  const status = document.createElement('span');
  status.className = 'pagination-status';
  status.textContent = `${page} / ${totalPages}ページ`;
  nav.appendChild(status);

  const next = document.createElement('button');
  next.className = 'pagination-button';
  next.type = 'button';
  next.textContent = '次へ';
  next.disabled = page >= totalPages;
  next.addEventListener('click', () => onPageChange(page + 1));
  nav.appendChild(next);

  return nav;
}

function paginateItems(items, page, pageSize) {
  const totalPages = Math.max(1, Math.ceil(items.length / pageSize));
  const safePage = Math.min(Math.max(1, page), totalPages);
  const start = (safePage - 1) * pageSize;
  return {
    page: safePage,
    items: items.slice(start, start + pageSize),
  };
}

function renderEventsHeader(counts) {
  const header = document.getElementById('events-header');
  header.innerHTML = '';

  ].forEach(item => {
    const tab = document.createElement('button');
    tab.className = 'events-switch-tab' + (activeEventsSection === item.value ? ' active' : '');
    tab.textContent = item.label;
    tab.addEventListener('click', () => {
      activeEventsSection = item.value;
      eventPages[activeEventsSection] = 1;
      renderEventsView();
    });
    switcher.appendChild(tab);

function renderEventsView() {
  const header = document.getElementById('events-header');
  const body = document.getElementById('events-body');
  header.innerHTML = '';
  body.innerHTML = '';
  if (communityEventsUnavailable) {
    const empty = document.createElement('div');
    empty.id = 'events-empty';
    empty.textContent = 'イベントデータの準備がまだ完了していません';
    body.appendChild(empty);
    return;
  }
  const now = new Date();
  const displayEvents = dedupeEvents(communityEvents);
  const upcoming = displayEvents
    .filter(event => isUpcomingEvent(event, now))
    .sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
  const past = displayEvents
    .filter(event => !isUpcomingEvent(event, now))
    .sort((a, b) => new Date(b.starts_at) - new Date(a.starts_at));

  renderEventsHeader({ total: displayEvents.length, upcoming: upcoming.length, past: past.length });
  const calendarEvents = displayEvents
    .filter(event => !event.cancelled_at)
    .sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
  const visibleEvents = activeEventsSection === 'calendar'
    ? calendarEvents.filter(event => {
      if (!eventCalendarMonths.calendar) eventCalendarMonths.calendar = defaultCalendarMonth(upcoming.length ? upcoming : calendarEvents, 'calendar');
      const date = new Date(event.starts_at);
      return !Number.isNaN(date.getTime()) && monthKey(date) === monthKey(eventCalendarMonths.calendar);
    })
    : activeEventsSection === 'upcoming'
      ? upcoming
      : past;

  if (activeEventsSection === 'calendar') {
    const calendar = renderEventCalendar(calendarEvents, activeEventsSection);
    if (calendar) body.appendChild(calendar);
    if (visibleEvents.length) {
      const title = document.createElement('div');
      title.className = 'events-section-title';
      title.textContent = 'この月のイベント';
      body.appendChild(title);
    }
  }

  const paginated = paginateItems(visibleEvents, eventPages[activeEventsSection], EVENT_PAGE_SIZE);
  eventPages[activeEventsSection] = paginated.page;
  paginated.items.forEach(event => body.appendChild(buildEventCard(event, activeEventsSection)));
  const pagination = buildPagination({
    page: paginated.page,
    totalItems: visibleEvents.length,
    pageSize: EVENT_PAGE_SIZE,
    onPageChange: nextPage => {
      eventPages[activeEventsSection] = nextPage;
      renderEventsView();
      document.getElementById('events-view').scrollTop = 0;
    },
  });
  if (pagination) body.appendChild(pagination);
  if (visibleEvents.length === 0) {
    const empty = document.createElement('div');
    empty.id = 'events-empty';
    empty.textContent = activeEventsSection === 'calendar'
      ? 'この月のイベントはありません'
      : activeEventsSection === 'upcoming'
      ? 'これから開催するイベントはありません'
      : '開催済みイベントはありません';
    body.appendChild(empty);
  }
  if (pendingEventScrollId) {
    const targetId = pendingEventScrollId;
    pendingEventScrollId = null;
    requestAnimationFrame(() => {
      const target = document.getElementById(targetId);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }
}

const BOOKSHELF_SPINE_COLORS = ['#3b5c78', '#7a4e3a', '#4a6741', '#7a3b52', '#5b4a7a', '#7a6b3b'];

function bookshelfSpineColor(title) {
  let hash = 0;
  for (let i = 0; i < title.length; i++) hash = (hash * 31 + title.charCodeAt(i)) >>> 0;
  return BOOKSHELF_SPINE_COLORS[hash % BOOKSHELF_SPINE_COLORS.length];
}

function buildBookshelfCard(book) {
  const wrap = document.createElement('div');

    img.loading = 'lazy';
    cover.appendChild(img);
  } else {
    cover.style.background = bookshelfSpineColor(book.title);
    cover.textContent = book.title;
  }
  wrap.appendChild(cover);

  const title = document.createElement('div');
  title.className = 'bookshelf-book-title';
  title.textContent = book.title;

  if (book.author_name) {

        goToMemberDetail(book.member_nickname);
      });
      author.appendChild(authorLink);
    } else {
      author.textContent = book.author_name;
    }
    wrap.appendChild(author);
  }

  const linksRow = document.createElement('div');
  linksRow.className = 'bookshelf-book-links';
  const amazonLink = document.createElement('a');

  amazonLink.target = '_blank';

    pdfLink.target = '_blank';
    pdfLink.rel = 'noopener noreferrer';
    pdfLink.textContent = 'PDF';
    linksRow.appendChild(pdfLink);

  wrap.appendChild(linksRow);
