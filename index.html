// ため削除不可。DB側のRLSも同じ条件、supabase/member_auth_policies_posts.sql)。
function canRemoveCommunityPost(post) {
  return Boolean(authMemberNickname)
    && ['book', 'travel'].includes(post.content_type)
    && post.member_nickname === authMemberNickname;
}

function buildCommunityPostCard(post, { onRemove }) {
  const card = document.createElement('div');
  card.className = 'community-post-card';

  if (canRemoveCommunityPost(post)) {
    const removeBtn = document.createElement('button');
    removeBtn.className = 'community-post-remove';
    removeBtn.textContent = '✕';
    removeBtn.title = 'この投稿を非表示にする';
    removeBtn.addEventListener('click', () => onRemove(post));
    card.appendChild(removeBtn);
  }

  if (post.title) {
    const title = document.createElement('div');
    title.className = 'community-post-title';
    title.textContent = post.title;
    card.appendChild(title);
  }

  const summary = document.createElement('div');
  summary.className = 'community-post-summary';
  summary.textContent = post.summary;
  card.appendChild(summary);

  const meta = document.createElement('div');
  meta.className = 'community-post-meta';
  // 相談系は複数人の議論スレッドであることが多く、またプライバシー配慮のため、
  // 投稿者名は単独投稿として扱う読んだ本・旅行に限定して表示する。
  const authorName = ['book', 'travel'].includes(post.content_type)
    ? (post.member_nickname || post.discord_author_display_name)
    : null;
  if (authorName) {
    const author = document.createElement('span');
    author.className = 'community-post-author';
    author.textContent = authorName;
    meta.appendChild(author);
  }
  const postedMonth = formatCommunityPostMonth(post.posted_at);
  if (postedMonth) {
    const date = document.createElement('span');
    date.className = 'community-post-date';
    date.textContent = postedMonth;
    meta.appendChild(date);
  }
  const link = document.createElement('a');
  link.className = 'community-post-permalink';
  link.href = post.discord_permalink;
  link.target = '_blank';
  link.rel = 'noopener';
  link.textContent = 'Discordで見る →';
  meta.appendChild(link);
  card.appendChild(meta);

  return card;
}

async function deleteCommunityPost(post) {
  const params = new URLSearchParams({ id: `eq.${post.id}` });
  await fetch(`${SUPABASE_URL}/rest/v1/community_posts?${params.toString()}`, {
    method: 'DELETE',
    headers: authHeaders(),
  });
  communityPosts = communityPosts.filter(p => p.id !== post.id);
  if (post.content_type === 'travel') removeTravelPostMarker(post);
  renderCommunityView();
  if (document.getElementById('member-detail-view').style.display === 'block') {
    const match = location.hash.match(/^#member\/(.+)$/);
    if (match) openMemberDetail(decodeURIComponent(match[1]), { updateHash: false });
  }
}

let activeCommunityType = null; // null = すべて
let communityQuery = '';
const COMMUNITY_PAGE_SIZE = 10;
let communityPage = 1;

function matchesCommunityQuery(post, query) {
  const q = query.trim().toLowerCase();
  if (!q) return true;
  const authorFields = ['book', 'travel'].includes(post.content_type)
    ? [post.member_nickname, post.discord_author_display_name]
    : [];
  const haystack = [post.title, post.summary, ...authorFields, ...communityPostMonthSearchTerms(post.posted_at)]
    .filter(Boolean).join(' ').toLowerCase();
  return haystack.includes(q);
}

function filteredCommunityPosts() {
  const typesToShow = activeCommunityType ? [activeCommunityType] : COMMUNITY_CONTENT_TYPE_ORDER;
  return typesToShow.flatMap(type => (
    communityPosts
      .filter(p => p.content_type === type && matchesCommunityQuery(p, communityQuery))
      .sort((a, b) => (a.posted_at < b.posted_at ? 1 : -1))
  ));
}

function renderCommunityView() {
  const header = document.getElementById('community-header');
  header.innerHTML = '';

  const searchWrap = document.createElement('div');
  searchWrap.id = 'community-search-wrap';
  const searchInput = document.createElement('input');
  searchInput.id = 'community-search';
  searchInput.type = 'text';
  searchInput.placeholder = 'タイトル・本文・投稿者・年月で検索…';
  searchInput.autocomplete = 'off';
  searchInput.value = communityQuery;
  const searchClear = document.createElement('button');
  searchClear.id = 'community-search-clear';
  searchClear.textContent = '✕';
  searchClear.style.display = communityQuery ? 'block' : 'none';
  searchInput.addEventListener('input', () => {
    communityQuery = searchInput.value;
    communityPage = 1;
    searchClear.style.display = communityQuery ? 'block' : 'none';
    renderCommunityBody();
  });
  searchClear.addEventListener('click', () => {
    communityQuery = '';
    communityPage = 1;
    searchInput.value = '';
    searchClear.style.display = 'none';
    searchInput.focus();
    renderCommunityBody();
  });
  searchWrap.appendChild(searchInput);
  searchWrap.appendChild(searchClear);
  header.appendChild(searchWrap);

  const pillRow = document.createElement('div');
  pillRow.id = 'community-pill-row';
  const allPill = document.createElement('button');
  allPill.className = 'community-type-pill' + (activeCommunityType === null ? ' active' : '');
  allPill.textContent = 'すべて';
  allPill.addEventListener('click', () => { activeCommunityType = null; communityPage = 1; renderCommunityView(); });
  pillRow.appendChild(allPill);
  COMMUNITY_CONTENT_TYPE_ORDER.forEach(type => {
    const meta = CONTENT_TYPE_META[type];
    const pill = document.createElement('button');
    pill.className = 'community-type-pill' + (activeCommunityType === type ? ' active' : '');
    pill.textContent = `${meta.icon} ${meta.label}`;
    pill.addEventListener('click', () => { activeCommunityType = type; communityPage = 1; renderCommunityView(); });
    pillRow.appendChild(pill);
  });
  header.appendChild(pillRow);

  renderCommunityBody();
}

function renderCommunityBody() {
  const body = document.getElementById('community-body');
  body.innerHTML = '';

  const posts = filteredCommunityPosts();
  const paginated = paginateItems(posts, communityPage, COMMUNITY_PAGE_SIZE);
  communityPage = paginated.page;
  let lastType = null;

  paginated.items.forEach(post => {
    if (post.content_type !== lastType) {
      const title = document.createElement('div');
      title.className = 'community-section-title';
      title.textContent = `${CONTENT_TYPE_META[post.content_type].icon} ${CONTENT_TYPE_META[post.content_type].label}`;
      body.appendChild(title);
      lastType = post.content_type;
    }
    body.appendChild(buildCommunityPostCard(post, { onRemove: deleteCommunityPost }));
  });

  const pagination = buildPagination({
    page: paginated.page,
    totalItems: posts.length,
    pageSize: COMMUNITY_PAGE_SIZE,
    onPageChange: nextPage => {
      communityPage = nextPage;
      renderCommunityBody();
      document.getElementById('community-view').scrollTop = 0;
    },
  });
  if (pagination) body.appendChild(pagination);

  if (posts.length === 0) {
    const empty = document.createElement('div');
    empty.id = 'community-empty';
    empty.textContent = activeCommunityType
      ? 'このカテゴリの投稿はまだ登録されていません'
      : '表示できる投稿がありません';
    body.appendChild(empty);
  }
}

function buildCommunityPostsSection(member) {
  const wrap = document.createElement('div');
  const memberPosts = communityPosts.filter(p => p.member_nickname === member.nickname);
  if (!memberPosts.length) return wrap;

  DETAIL_CONTENT_TYPE_ORDER.forEach(type => {
    const posts = memberPosts.filter(p => p.content_type === type);
    if (!posts.length) return;

    const section = document.createElement('div');
    section.className = 'detail-section';
    const title = document.createElement('div');
    title.className = 'detail-section-title';
    title.textContent = `${CONTENT_TYPE_META[type].icon} ${CONTENT_TYPE_META[type].label}`;
    section.appendChild(title);

    const list = document.createElement('div');
    list.className = 'detail-community-list';
    posts.forEach(post => {
      const item = document.createElement('div');
      item.className = 'detail-community-item';

      if (canRemoveCommunityPost(post)) {
        const removeBtn = document.createElement('button');
        removeBtn.className = 'detail-community-remove';
        removeBtn.textContent = '✕';
        removeBtn.title = '非表示にする';
        removeBtn.addEventListener('click', () => deleteCommunityPost(post));
        item.appendChild(removeBtn);
      }

      if (post.title) {
        const itemTitle = document.createElement('div');
        itemTitle.className = 'detail-community-title';
        itemTitle.textContent = post.title;
        item.appendChild(itemTitle);
      }

      const summary = document.createElement('div');
      summary.className = 'detail-community-summary';
      summary.textContent = post.summary;
      item.appendChild(summary);

      const link = document.createElement('a');
      link.className = 'detail-community-link';
      link.href = post.discord_permalink;
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = 'Discordで見る →';
      item.appendChild(link);

      list.appendChild(item);
    });
    section.appendChild(list);
    wrap.appendChild(section);
  });

  return wrap;
}

// 関連記事の公開日を「9/20」のような短い表記にする(タイムゾーン厳密性より見た目の
// わかりやすさを優先)。日付が取れない記事(RSSのpubDateが欠けている等)ではnullを返し、
// 呼び出し側でソース名だけ表示する。
function formatPublishedDate(isoString) {
  if (!isoString) return null;
  const date = new Date(isoString);
  if (Number.isNaN(date.getTime())) return null;
  return `${date.getMonth() + 1}/${date.getDate()}`;
}

// ゆるトーク画面: Discordのマッチング告知メッセージから直接開く、URLを知っていれば誰でも
// 見られる共有ページ(かずさんの判断、ログイン機構は作らない)。表示データはマッチング成立
// と同時にscripts/run_member_matching.pyが書き込んだmember_match_group_topicsのスナップ
// ショットをそのまま読むだけで、この画面側では何も計算しない。
async function renderYuruTalkView(groupId) {
  const body = document.getElementById('yuru-talk-body');
  body.innerHTML = '<div class="yuru-talk-error">読み込み中…</div>';
  if (!groupId) {
    body.innerHTML = '<div class="yuru-talk-error">グループが指定されていません。Discordのマッチング告知メッセージのリンクから開いてください。</div>';
    return;
  }

  const headers = authHeaders();
  let members, topicsRows;
  try {
    const [membersRes, topicsRes] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/member_match_group_members?group_id=eq.${encodeURIComponent(groupId)}&select=member_nickname`, { headers }),
      fetch(`${SUPABASE_URL}/rest/v1/member_match_group_topics?group_id=eq.${encodeURIComponent(groupId)}&select=group_topic,pair_topics,common_tags`, { headers }),
    ]);
    members = await membersRes.json();
    topicsRows = await topicsRes.json();
  } catch (err) {
    body.innerHTML = '<div class="yuru-talk-error">読み込みに失敗しました。時間をおいて開き直してみてください。</div>';
    return;
  }

  if (!Array.isArray(members) || members.length === 0) {
    body.innerHTML = '<div class="yuru-talk-error">このグループが見つかりませんでした。リンクが古いか、まだ準備中の可能性があります。</div>';
    return;
  }

  const nicknames = members.map(m => m.member_nickname);
  let profileByNickname = {};
  try {
    const params = new URLSearchParams({
      select: 'nickname,avatar_url',
      nickname: `in.(${nicknames.map(n => `"${n.replace(/"/g, '\\"')}"`).join(',')})`,
    });
    const profilesRes = await fetch(`${SUPABASE_URL}/rest/v1/member_profiles?${params.toString()}`, { headers });
    const profiles = await profilesRes.json();
    if (Array.isArray(profiles)) profileByNickname = Object.fromEntries(profiles.map(p => [p.nickname, p]));
  } catch (err) {
    // プロフィール(アイコン)が引けなくても、ニックネームだけで表示は続行する。
  }

  const topics = (topicsRows && topicsRows[0]) || { group_topic: null, pair_topics: [], common_tags: [] };
  const commonTags = Array.isArray(topics.common_tags) ? topics.common_tags : [];

  body.innerHTML = '';

  const title = document.createElement('h1');
  title.className = 'yuru-talk-title';
  title.textContent = '🗨️ ゆるトーク';
  body.appendChild(title);

  const subtitle = document.createElement('p');
  subtitle.className = 'yuru-talk-subtitle';
  subtitle.textContent = 'マッチしたメンバーの共通の興味・関心をもとに、気軽に会話をはじめてみましょう。';
  body.appendChild(subtitle);

  const memberRow = document.createElement('div');
  memberRow.className = 'yuru-talk-members';
  nicknames.forEach(nickname => {
    // メンバーのニックネームタブをクリックしたら詳細ページに飛べるように、通常のメンバー
    // 詳細リンクと同じ#member/<nickname>形式のURLにする(クリックすると「リンクをコピー」
    // ボタンと同じURLへ遷移し、ゆるトーク専用ページを離れて通常のディレクトリ画面が開く)。
    const chip = document.createElement('a');
    chip.className = 'yuru-talk-member-chip';
    chip.href = `${location.origin}${location.pathname}#member/${encodeURIComponent(nickname)}`;
    const avatar = document.createElement('span');
    avatar.className = 'yuru-talk-member-avatar';
    const avatarUrl = (profileByNickname[nickname] || {}).avatar_url;
    if (avatarUrl) {
      const img = document.createElement('img');
      img.src = avatarUrl;
      img.alt = '';
      img.loading = 'lazy';
      avatar.appendChild(img);
    } else {
      avatar.textContent = nickname.slice(0, 1);
    }
    chip.appendChild(avatar);
    chip.appendChild(document.createTextNode(nickname));
    memberRow.appendChild(chip);
  });
  body.appendChild(memberRow);

  if (topics.group_topic || (topics.pair_topics || []).length) {
    const topicCard = document.createElement('div');
    topicCard.className = 'yuru-talk-card';
    const heading = document.createElement('p');
    heading.className = 'yuru-talk-card-title';
    heading.textContent = '💡 盛り上がりそうな話題';
    topicCard.appendChild(heading);
    if (topics.group_topic) {
      const line = document.createElement('p');
      line.className = 'yuru-talk-topic-line';
      line.textContent = `(全員) ${topics.group_topic}`;
      topicCard.appendChild(line);
    }
    (topics.pair_topics || []).forEach(pt => {
      if (pt.topic === topics.group_topic) return;
      const line = document.createElement('p');
      line.className = 'yuru-talk-topic-line';
      line.textContent = `(${pt.a}さん×${pt.b}さん) ${pt.topic}`;
      topicCard.appendChild(line);
    });
    body.appendChild(topicCard);
  }

  if (!commonTags.length) {
    const empty = document.createElement('div');
    empty.className = 'yuru-talk-card';
    empty.innerHTML = '<p class="yuru-talk-empty">今回は共通のタグが見つかりませんでした。上の話題や自己紹介ページを参考に話してみてください。</p>';
    body.appendChild(empty);
    return;
  }

  const tagCard = document.createElement('div');
  tagCard.className = 'yuru-talk-card';
  const tagHeading = document.createElement('p');
  tagHeading.className = 'yuru-talk-card-title';
  tagHeading.textContent = `共通の話題 (${nicknames.length}人中、選んで話題をチェックしてみましょう)`;
  tagCard.appendChild(tagHeading);
  const tagRow = document.createElement('div');
  tagRow.className = 'yuru-talk-tags';
  tagCard.appendChild(tagRow);
  body.appendChild(tagCard);

  const detailCard = document.createElement('div');
  detailCard.className = 'yuru-talk-card';
  body.appendChild(detailCard);

  function renderTagDetail(tag) {
    detailCard.innerHTML = '';

    const qHeading = document.createElement('p');
    qHeading.className = 'yuru-talk-card-title';
    qHeading.textContent = `「${tag.value}」で話してみましょう`;
    detailCard.appendChild(qHeading);

    const qList = document.createElement('ul');
    qList.className = 'yuru-talk-questions';
    (tag.questions || []).forEach(q => {
      const li = document.createElement('li');
      li.textContent = q;
      qList.appendChild(li);
    });
    detailCard.appendChild(qList);

    const newsHeading = document.createElement('p');
    newsHeading.className = 'yuru-talk-card-title';
    newsHeading.style.marginTop = '16px';
    newsHeading.textContent = '📰 関連記事';
    detailCard.appendChild(newsHeading);

    const news = tag.news || [];
    if (!news.length) {
      const empty = document.createElement('p');
      empty.className = 'yuru-talk-empty';
      empty.textContent = '関連する記事は見つかりませんでした。';
      detailCard.appendChild(empty);
    } else {
      news.forEach(article => {
        const a = document.createElement('a');
        a.className = 'yuru-talk-news-item';
        a.href = article.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        const titleEl = document.createElement('div');
        titleEl.className = 'yuru-talk-news-title';
        titleEl.textContent = article.title;
        const sourceEl = document.createElement('div');
        sourceEl.className = 'yuru-talk-news-source';
        // publishedAtは新しい順に並んでいるが、見た目でも鮮度がわかるように日付を出す
        // (「できるだけタイムリーなニュースを表示したい」というフィードバック、2026-09-23)。
        const publishedLabel = formatPublishedDate(article.published_at);
        sourceEl.textContent = [article.source, publishedLabel].filter(Boolean).join(' · ');
        a.appendChild(titleEl);
        a.appendChild(sourceEl);
        detailCard.appendChild(a);
      });
    }
  }

  commonTags.forEach((tag, index) => {
    const pill = document.createElement('button');
    pill.type = 'button';
    pill.className = 'yuru-talk-tag' + (index === 0 ? ' active' : '');
    pill.innerHTML = `${tag.label}: ${tag.value} <span class="yuru-talk-tag-count">${tag.count}/${nicknames.length}</span>`;
    pill.addEventListener('click', () => {
      tagRow.querySelectorAll('.yuru-talk-tag').forEach(el => el.classList.remove('active'));
      pill.classList.add('active');
      renderTagDetail(tag);
    });
    tagRow.appendChild(pill);
  });

  renderTagDetail(commonTags[0]);
}

// ---- 初回ログイン時のメンバー登録(Issue #253) ----
// Discordでログインしたがプロフィールがまだない人に、Discordの自己紹介などから作るプロフィールを
// 確認してもらい、同意したら作成する。作成はサーバー側(supabase/functions/member-onboarding)で、
// FIRE研究所のDiscordサーバーのメンバーか確かめたうえで行う。
const ONBOARDING_URL = `${SUPABASE_URL}/functions/v1/member-onboarding`;

async function callOnboarding(body) {
  const res = await fetch(ONBOARDING_URL, {
    method: 'POST',
    headers: authHeaders({ 'Content-Type': 'application/json' }),
    body: JSON.stringify(body),
  });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  return data || { status: 'error', error: `http_${res.status}` };
}

// previewOnly: 登録済みの人が ?onboarding_preview=1 で確認画面の見た目だけ確かめる(作成はしない)。
async function startOnboarding({ previewOnly = false } = {}) {
  showLoginGate('loading');
  document.getElementById('login-gate-message').textContent = 'Discordのプロフィールを確認しています…';
  const data = await callOnboarding({ action: 'preview' });
  if (data.status === 'not_in_guild') { showLoginGate('nonmember'); return; }
  if (data.status === 'linked' && !previewOnly) { await finishOnboarding(); return; }
  if (data.status !== 'preview' && !(data.status === 'linked' && previewOnly)) {
    showLoginGate('error');
    document.getElementById('login-gate-message').textContent = 'プロフィールの確認に失敗しました。時間をおいて再読み込みしてください。';
    return;
  }
  renderOnboardingPreview(data, { previewOnly });
}

function renderOnboardingPreview(data, { previewOnly }) {
  showLoginGate('loading');
  const message = document.getElementById('login-gate-message');
  const button = document.getElementById('login-gate-button');
  const extra = document.getElementById('login-gate-extra');
  message.textContent = 'はじめまして!Discordのプロフィールと自己紹介をもとに、コミュニティマップにあなたのプロフィールを作成します。内容を確認してください。';

  const profile = document.createElement('div');
  profile.className = 'onboarding-profile';
  const avatar = document.createElement('img');
  avatar.className = 'onboarding-avatar';
  avatar.alt = '';
  if (data.avatar_url) avatar.src = data.avatar_url;
  const nameWrap = document.createElement('div');
  nameWrap.style.flex = '1';
  const nameLabel = document.createElement('label');
  nameLabel.className = 'onboarding-label';
  nameLabel.textContent = 'ニックネーム(変更できます)';
  const nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.className = 'onboarding-nickname';
  nameInput.maxLength = 40;
  nameInput.value = data.nickname || '';
  nameLabel.appendChild(nameInput);
  nameWrap.appendChild(nameLabel);
  profile.append(avatar, nameWrap);
  extra.appendChild(profile);

  const introLabel = document.createElement('span');
  introLabel.className = 'onboarding-label';
  introLabel.textContent = '自己紹介(Discordの自己紹介チャンネルから)';
  extra.appendChild(introLabel);
  const intro = document.createElement('div');
  intro.className = 'onboarding-intro';
  intro.textContent = data.self_intro_text || '自己紹介の投稿が見つかりませんでした。登録後、プロフィールから追加できます。';
  extra.appendChild(intro);

  const tagPicker = buildOnboardingTagPicker(data.tag_options || {}, data.suggested_tags || []);
  extra.appendChild(tagPicker.element);

  const locationTitle = document.createElement('div');
  locationTitle.className = 'onboarding-section-title';
  locationTitle.textContent = '居住地(都道府県など。地図に表示されます)';
  extra.appendChild(locationTitle);
  const locationInput = document.createElement('input');
  locationInput.type = 'text';
  locationInput.className = 'onboarding-location';
  locationInput.placeholder = '例: 東京都、神奈川県横浜市(空欄でもOK)';
  locationInput.value = data.suggested_location || '';
  extra.appendChild(locationInput);

  const hint = document.createElement('p');
  hint.className = 'onboarding-hint';
  hint.style.marginTop = '10px';
  hint.textContent = 'プロフィールはメンバーだけに表示されます(外部公開はオフ)。登録後も、自分のプロフィールからタグや自己紹介を追加・編集できます。';
  extra.appendChild(hint);

  const error = document.createElement('p');
  error.className = 'onboarding-error';
  error.hidden = true;
  extra.appendChild(error);
  const showError = text => { error.textContent = text; error.hidden = false; };
  if (data.nickname_taken) showError('このニックネームはすでに使われています。別のニックネームにしてください。');

  button.style.display = '';
  button.disabled = false;
  button.textContent = previewOnly ? '(確認用の表示です)' : 'この内容で登録する';
  if (previewOnly) button.disabled = true;
  button.onclick = async () => {
    const nickname = nameInput.value.trim();
    if (!nickname) { showError('ニックネームを入力してください。'); return; }
    button.disabled = true;
    button.textContent = '登録しています…';
    const result = await callOnboarding({ action: 'create', nickname, tags: tagPicker.selected() });
    if (result.status === 'created' || result.status === 'linked') {
      await finishOnboarding({ location: locationInput.value.trim() });
      return;
    }
    button.disabled = false;
    button.textContent = 'この内容で登録する';
    if (result.status === 'nickname_taken') showError('このニックネームはすでに使われています。別のニックネームにしてください。');
    else if (result.status === 'invalid_nickname') showError('ニックネームは40文字以内で入力してください。');
    else if (result.status === 'not_in_guild') showLoginGate('nonmember');
    else showError('登録に失敗しました。時間をおいてもう一度お試しください。');
  };

  const logout = document.createElement('button');
  logout.type = 'button';
  logout.className = 'onboarding-secondary';
  logout.textContent = previewOnly ? '閉じる' : '登録せずにログアウト';
  logout.onclick = previewOnly ? () => { location.href = location.pathname; } : signOutOfDiscord;
  document.getElementById('login-gate-secondary').appendChild(logout);
}

// タグの選択欄。カテゴリごとに、よく使われているタグをボタンで並べ、自己紹介から拾った候補は
// 選択済みにしておく。自由入力でも追加できる。
const ONBOARDING_TAG_CATEGORIES = ['fire_status', 'investment_style', 'mbti', 'interest', 'skill', 'consultation', 'wants_to_know'];

function buildOnboardingTagPicker(options, suggested) {
  const selected = new Set(suggested.map(t => `${t.category}\t${t.value}`));
  const element = document.createElement('div');
  const title = document.createElement('div');
  title.className = 'onboarding-section-title';
  title.textContent = 'タグ(自己紹介から候補を選んであります。押して付け外しできます)';
  element.appendChild(title);

  ONBOARDING_TAG_CATEGORIES.forEach(category => {
    const values = [...new Set([
      ...suggested.filter(t => t.category === category).map(t => t.value),
      ...(options[category] || []),
    ])];
    const block = document.createElement('div');
    block.className = 'onboarding-category';
    const label = document.createElement('div');
    label.className = 'onboarding-category-label';
    label.textContent = CATEGORY_META[category] ? CATEGORY_META[category].label : category;
    const chips = document.createElement('div');
    chips.className = 'onboarding-chips';
    const addChip = value => {
      const key = `${category}\t${value}`;
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'onboarding-chip' + (selected.has(key) ? ' selected' : '');
      chip.textContent = value;
      chip.addEventListener('click', () => {
        if (selected.has(key)) selected.delete(key); else selected.add(key);
        chip.classList.toggle('selected', selected.has(key));
      });
      chips.appendChild(chip);
      return chip;
    };
    values.forEach(addChip);

    const addRow = document.createElement('div');
    addRow.className = 'onboarding-chip-add';
    const input = document.createElement('input');
    input.type = 'text';
    input.maxLength = 30;
    input.placeholder = 'ほかに追加…';
    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.textContent = '追加';
    const add = () => {
      const value = input.value.trim();
      if (!value) return;
      const key = `${category}\t${value}`;
      if (!selected.has(key)) {
        selected.add(key);
        if (![...chips.children].some(c => c.textContent === value)) addChip(value);
        else [...chips.children].find(c => c.textContent === value).classList.add('selected');
      }
      input.value = '';
    };
    addBtn.addEventListener('click', add);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
    addRow.append(input, addBtn);

    block.append(label, chips, addRow);
    element.appendChild(block);
  });

  return {
    element,
    selected: () => [...selected].map(key => {
      const [category, value] = key.split('\t');
      return { category, value };
    }),
  };
}

async function finishOnboarding({ location = '' } = {}) {
  await applyAuthSession(authSession);
  if (!authMemberNickname) { showLoginGate('error'); return; }
  startApp();
  // 登録できたら自分のプロフィールを開く。居住地は既存の保存処理(地図のピンも更新)で保存する。
  try { await directoryLoadPromise; } catch (e) {}
  if (location) await saveLocation(authMemberNickname, location);
  else openMemberDetail(authMemberNickname);
}

function startApp() {
  appStarted = true;
  loadMembers();
  loadTravelPosts();
  markGuideSeen();
  hideLoginGate();
  selectView(['directory', 'map', 'events', 'community', 'bookshelf', 'official', 'usage', 'yuru-talk'].includes(INITIAL_VIEW) ? INITIAL_VIEW : 'directory');
}

// ログイン状態が確定するまでデータを取得せず、メンバーとして確認できたときだけ始める。
showLoginGate('loading');
window.addEventListener('resize', positionLoginGate);
initAuth().then(ok => {
  if (!ok) showLoginGate('error');
  else if (!authSession) {
    showLoginGate('signin');
    if (!hasSeenGuide()) openGuideModal();
  }
  else if (!authMemberNickname) startOnboarding();
  else if (new URLSearchParams(location.search).get('onboarding_preview') === '1') startOnboarding({ previewOnly: true });
  else startApp();
});
</script>
